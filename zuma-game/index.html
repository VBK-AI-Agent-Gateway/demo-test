<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>祖玛 Zuma · 网页版</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1a2233,#0d1117 60%);
    color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;padding:10px 14px 4px}
  h1{margin:0;font-size:19px;display:flex;gap:8px;align-items:center}
  h1 .logo{color:var(--accent)}
  .hud{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;justify-content:center}
  .hud b{color:var(--fg);font-variant-numeric:tabular-nums}
  .hud .warn b{color:var(--red)}
  .btns{display:flex;gap:8px}
  button{
    background:var(--accent);border:0;color:#04121f;font-weight:600;padding:8px 14px;
    border-radius:8px;cursor:pointer;font-size:13.5px;
  }
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  button:active{transform:translateY(1px)}
  #stage{position:relative;flex:1;width:100%;max-width:980px;display:flex;align-items:center;justify-content:center;min-height:0}
  canvas{
    background:radial-gradient(600px 400px at 50% 40%,#141b28,#0b0f16 75%);
    border:1px solid var(--border);border-radius:14px;
    max-width:100%;max-height:100%;touch-action:none;display:block;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  footer{color:var(--muted);font-size:12.5px;padding:6px 10px 10px;text-align:center}
  /* overlays */
  .overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(5,8,12,.72);backdrop-filter:blur(3px);z-index:10;border-radius:14px;
  }
  .overlay.open{display:flex}
  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:22px 26px;max-width:420px;width:calc(100% - 32px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .panel h2{margin:0 0 10px;font-size:24px}
  .panel p{color:var(--muted);margin:6px 0 14px;font-size:14px}
  .panel .big{font-size:40px;margin:8px 0;color:var(--yellow);font-weight:700}
  .panel .actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .legend{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
  .ball{width:16px;height:16px;border-radius:50%;box-shadow:inset -2px -3px 5px rgba(0,0,0,.45), 0 0 6px rgba(255,255,255,.15)}
  kbd{background:#21262d;border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12px}
  @media (max-width:900px){header{padding:8px 10px 2px}h1{font-size:17px}}
  @media (max-width:640px){h1{font-size:16px}.hud{gap:10px;font-size:12px}footer{font-size:11.5px}}
  @media (max-width:420px){header{gap:8px}.btns button{padding:7px 11px;font-size:12.5px}}
</style>
</head>
<body>
<header>
  <h1><span class="logo">◉</span> 祖玛 Zuma</h1>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连击 <b id="combo">x1</b></span>
    <span>剩余 <b id="left">0</b></span>
    <span class="warn">进度 <b id="danger">0%</b></span>
  </div>
  <div class="btns">
    <button id="btnPause" class="ghost">⏸ 暂停</button>
    <button id="btnRestart" class="ghost">↺ 重开</button>
    <button id="btnMute" class="ghost">🔊</button>
  </div>
</header>

<div id="stage">
  <canvas id="game" width="960" height="600" aria-label="祖玛游戏画布"></canvas>

  <!-- start menu -->
  <div class="overlay open" id="menu">
    <div class="panel">
      <h2>◉ 祖玛 Zuma</h2>
      <p>珠子沿轨道涌向洞口。<b style="color:var(--fg)">瞄准并发射</b>同色珠子，<b style="color:var(--fg)">3 连及以上</b>即可消除；利用间隙回缩制造<b style="color:var(--fg)">连锁</b>。清空全部珠子获胜，珠子进洞则失败。</p>
      <div class="legend">
        <span class="ball" style="background:#ef5350"></span>
        <span class="ball" style="background:#42a5f5"></span>
        <span class="ball" style="background:#66bb6a"></span>
        <span class="ball" style="background:#ffa726"></span>
        <span class="ball" style="background:#ab47bc"></span>
        <span class="ball" style="background:#ffee58"></span>
      </div>
      <p style="font-size:13px">🖱 鼠标移动瞄准 · 点击发射 &nbsp;|&nbsp; 📱 触摸拖动瞄准 · 松手发射 &nbsp;|&nbsp; <kbd>空格</kbd> 暂停</p>
      <div class="actions">
        <button id="btnStart">▶ 开始游戏</button>
      </div>
    </div>
  </div>

  <!-- pause -->
  <div class="overlay" id="pause">
    <div class="panel">
      <h2>⏸ 已暂停</h2>
      <div class="actions">
        <button id="btnResume">▶ 继续</button>
        <button id="btnPauseRestart" class="ghost">↺ 重新开始</button>
      </div>
    </div>
  </div>

  <!-- result -->
  <div class="overlay" id="result">
    <div class="panel">
      <h2 id="resultTitle">🎉 你赢了！</h2>
      <div class="big" id="resultScore">0</div>
      <p id="resultMsg"></p>
      <div class="actions">
        <button id="btnAgain">↺ 再玩一局</button>
      </div>
    </div>
  </div>
</div>

<footer>祖玛 · Canvas 单文件实现 · 同色 3 连消除 + 连锁 + 轨道推进 · 支持鼠标/触摸</footer>

<script>
"use strict";
/* ============================================================
   祖玛 Zuma — single-file HTML5 Canvas game
   - Chain of balls advancing along a sampled path (arc-length s)
   - Shooter aims with mouse/touch, fires flying balls
   - Collision -> insert into chain -> >=3 same color -> clear
   - Gaps collapse (with chain reaction) -> combo
   - All cleared -> win; head reaches pit -> lose
============================================================ */

const COLORS = ["#ef5350", "#42a5f5", "#66bb6a", "#ffa726", "#ab47bc", "#ffee58"];
const COLOR_COUNT = COLORS.length;
const BALL_R = 16;          // ball radius (path spacing)
const SPACING = BALL_R * 2; // distance between adjacent chain balls
const SPEED = 26;           // chain advance px/s (base)
const FLY_SPEED = 900;      // flying ball px/s
const CLEAR_RADIUS = 3;     // gap (in ball units) that triggers collapse

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

/* ---------------- path: sampled polyline (spiral into pit) ---------------- */
function buildPath(w, h) {
  // spiral from top-left down into center pit
  const pts = [];
  const cx = w / 2, cy = h / 2;
  const turns = 2.15;
  const startR = Math.min(w, h) * 0.46;
  const endR = 34;
  const steps = 900;
  // entry: come from top-left corner area
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    pts.push({ x: w * (0.02 + 0.10 * t), y: h * (0.06 + 0.16 * Math.sin(t * Math.PI * 0.5)) });
  }
  // spiral inward (clockwise), starting angle from entry direction
  const startAngle = Math.PI * 0.18;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const ang = startAngle + t * turns * Math.PI * 2;
    const r = startR + (endR - startR) * Math.pow(t, 1.15);
    pts.push({ x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r * 0.92 });
  }
  // cumulative arc length
  const cum = [0];
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y;
    cum.push(cum[i - 1] + Math.hypot(dx, dy));
  }
  return { pts, cum, len: cum[cum.length - 1], pit: { x: pts[pts.length - 1].x, y: pts[pts.length - 1].y } };
}

let path = buildPath(W, H);

// position along path at arc length s (clamped)
function posAt(s) {
  const { pts, cum, len } = path;
  if (s <= 0) return { x: pts[0].x, y: pts[0].y, ang: 0 };
  if (s >= len) {
    const n = pts.length;
    const a = pts[n - 2], b = pts[n - 1];
    return { x: b.x, y: b.y, ang: Math.atan2(b.y - a.y, b.x - a.x) };
  }
  // binary search
  let lo = 0, hi = cum.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (cum[mid] <= s) lo = mid; else hi = mid;
  }
  const seg = cum[hi] - cum[lo] || 1;
  const t = (s - cum[lo]) / seg;
  const a = pts[lo], b = pts[hi];
  return {
    x: a.x + (b.x - a.x) * t,
    y: a.y + (b.y - a.y) * t,
    ang: Math.atan2(b.y - a.y, b.x - a.x),
  };
}

/* ---------------- game state ---------------- */
let state = "menu"; // menu | playing | paused | over
let chain = [];     // [{color, s}] s = arc length of ball center from path start (0 at pit end? see below)
                     // Convention: s measured from PATH START; head (closest to pit) has LARGEST s.
let headS = 0;      // s of the front-most ball (largest s)
let shooter = { x: W / 2, y: H / 2, ang: -Math.PI / 2 };
let current = null; // {color} loaded in shooter
let next = null;    // {color} next up
let flying = [];    // [{x,y,vx,vy,color}]
let score = 0, combo = 1, comboTimer = 0;
let spawned = 0, cleared = 0;
let muted = false;
let lastT = 0;
let shakeT = 0;

const TOTAL_BALLS = 90;

function randColor() {
  // bias towards colors present in chain to make matches possible
  return COLORS[(Math.random() * COLOR_COUNT) | 0];
}

function resetGame() {
  path = buildPath(W, H);
  chain = [];
  headS = 0;
  // spawn initial chain: balls start "before" the path start (s < 0 means off-screen feed),
  // but simpler: start at s = 0 and grow backwards (s decreasing) — head advances toward len.
  spawned = 0;
  const initial = Math.min(TOTAL_BALLS, 34);
  for (let i = 0; i < initial; i++) {
    chain.push({ color: randColor(), s: -i * SPACING }); // tail has smallest s
    spawned++;
  }
  // ensure no immediate free 3s at start? keep simple: normalize runs
  normalizeRuns();
  chain.sort((a, b) => a.s - b.s); // ascending: tail -> head
  headS = chain[chain.length - 1].s;
  shooter = { x: W / 2, y: H / 2, ang: -Math.PI / 2 };
  current = { color: randColor() };
  next = { color: randColor() };
  flying = [];
  score = 0; combo = 1; comboTimer = 0; cleared = 0;
  shakeT = 0;
  updateHUD();
}

function normalizeRuns() {
  // avoid 3+ same color in a row at spawn
  for (let i = 2; i < chain.length; i++) {
    if (chain[i].color === chain[i - 1].color && chain[i].color === chain[i - 2].color) {
      let c;
      do { c = randColor(); } while (c === chain[i - 1].color);
      chain[i].color = c;
    }
  }
}

/* ---------------- HUD ---------------- */
const elScore = document.getElementById("score");
const elCombo = document.getElementById("combo");
const elLeft = document.getElementById("left");
const elDanger = document.getElementById("danger");
function updateHUD() {
  elScore.textContent = score;
  elCombo.textContent = "x" + combo;
  elLeft.textContent = Math.max(0, TOTAL_BALLS - cleared);
  const pct = path.len > 0 ? Math.max(0, Math.min(100, Math.round((headS / path.len) * 100))) : 0;
  elDanger.textContent = pct + "%";
}

/* ---------------- audio (tiny WebAudio blips, optional) ---------------- */
let actx = null;
function beep(freq, dur, type, vol) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.value = vol || 0.06;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.12));
    o.stop(actx.currentTime + (dur || 0.12) + 0.02);
  } catch (e) {}
}

/* ---------------- shooting ---------------- */
function fire() {
  if (state !== "playing" || !current) return;
  const speed = FLY_SPEED;
  flying.push({
    x: shooter.x + Math.cos(shooter.ang) * 26,
    y: shooter.y + Math.sin(shooter.ang) * 26,
    vx: Math.cos(shooter.ang) * speed,
    vy: Math.sin(shooter.ang) * speed,
    color: current.color,
  });
  beep(520, 0.08, "square", 0.04);
  current = next;
  next = { color: randColor() };
}

function swapShooter() {
  if (state !== "playing" || !current || !next) return;
  const t = current; current = next; next = t;
  beep(300, 0.06, "triangle", 0.04);
}

/* ---------------- collision & chain logic ---------------- */
function updateFlying(dt) {
  for (let i = flying.length - 1; i >= 0; i--) {
    const b = flying[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // out of bounds -> remove
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) {
      flying.splice(i, 1);
      continue;
    }

    // hit pit rim (center) without chain contact? ignore.
    // collision with chain balls
    let hitIdx = -1, hitDist = Infinity;
    for (let j = 0; j < chain.length; j++) {
      const p = posAt(chain[j].s);
      const d = Math.hypot(p.x - b.x, p.y - b.y);
      if (d < BALL_R * 2 - 2 && d < hitDist) { hitDist = d; hitIdx = j; }
    }

    if (hitIdx >= 0) {
      insertBall(b, hitIdx);
      flying.splice(i, 1);
      continue;
    }

    // hit the shooter? (self) skip
  }
}

function insertBall(b, idx) {
  if (chain.length === 0) {
    // start a new chain at current head position
    const s = Math.max(0, Math.min(path.len - SPACING, headS));
    chain.push({ color: b.color, s });
    checkMatches(chain.length - 1);
    return;
  }
  const target = chain[idx];
  const p = posAt(target.s);
  // decide side: front (toward pit) or back based on approach direction
  // project flight position relative to target along path tangent
  const aheadSign = Math.sign(
    (b.x - p.x) * Math.cos(p.ang) + (b.y - p.y) * Math.sin(p.ang)
  );
  // insertion index in sorted-ascending array
  let insertAt = aheadSign >= 0 ? idx + 1 : idx;
  if (insertAt < 0) insertAt = 0;
  if (insertAt > chain.length) insertAt = chain.length;

  // new s = neighbor s +/- spacing (toward smaller s = toward start/tail)
  let newS;
  if (insertAt === chain.length) {
    newS = chain[chain.length - 1].s + SPACING;
    if (newS > path.len) newS = chain[chain.length - 1].s - SPACING, insertAt = chain.length - 1;
  } else if (insertAt === 0) {
    newS = chain[0].s - SPACING;
  } else {
    const prev = chain[insertAt - 1], nextB = chain[insertAt];
    newS = (prev.s + nextB.s) / 2;
    // if gap too small, push forward by resolving later in resolveOverlaps
  }

  chain.splice(insertAt, 0, { color: b.color, s: newS });
  headS = chain[chain.length - 1].s;

  resolveOverlaps(insertAt);
  checkMatches(insertAt);
  updateHUD();
}

// push balls apart if closer than SPACING (toward head direction)
function resolveOverlaps(startIdx) {
  // forward pass: ensure each ball >= SPACING after previous
  for (let i = Math.max(1, startIdx); i < chain.length; i++) {
    if (chain[i].s < chain[i - 1].s + SPACING) {
      chain[i].s = chain[i - 1].s + SPACING;
    }
  }
  // backward pass for inserted ball behind others
  for (let i = Math.min(chain.length - 2, startIdx); i >= 0; i--) {
    if (chain[i].s > chain[i + 1].s - SPACING) {
      chain[i].s = chain[i + 1].s - SPACING;
    }
  }
  headS = chain.length ? chain[chain.length - 1].s : headS;
}

function checkMatches(idx) {
  if (idx < 0 || idx >= chain.length) return;
  const color = chain[idx].color;
  let a = idx, b = idx;
  while (a - 1 >= 0 && chain[a - 1].color === color) a--;
  while (b + 1 < chain.length && chain[b + 1].color === color) b++;
  const runLen = b - a + 1;
  if (runLen >= 3) {
    // score: base + combo multiplier
    const gain = runLen * 10 * combo;
    score += gain;
    cleared += runLen;
    combo = Math.min(9, combo + 1);
    comboTimer = 2.2;
    // remove run
    chain.splice(a, runLen);
    beep(660 + combo * 60, 0.14, "sine", 0.07);
    shakeT = 0.18;

    // collapse: move tail balls forward to close gap (toward head, increasing s)
    // find new anchor: the ball before removed run (chain[a-1]) or after (chain[a])
    // Balls with s < removed run's s should move up by runLen*SPACING (cap at spacing chain)
    // Simpler: leave gaps; gap collapse handled in updateChain (gap collapse animation)
    // Trigger collapse by nudging: set a flag to collapse this gap
    collapseGap(a);
    updateHUD();

    // chain reaction check after collapse (immediate): recheck around junction
    if (a > 0 && a < chain.length) {
      // after collapse the two sides join -> may form new run
      checkMatches(a);
    }
    // win?
    if (chain.length === 0 && spawned >= TOTAL_BALLS) {
      endGame(true);
    }
  } else {
    // no match; combo resets if timer expired (handled in loop)
  }
}

// collapse gap at index a: pull all balls with smaller s forward until spacing restored
function collapseGap(a) {
  if (a <= 0) {
    // gap at tail end: nothing behind to pull
    return;
  }
  // balls from a-1 backwards are "behind" the removed run; move them forward
  // actually after splice, chain[a] is the ball that was after the run (front side),
  // chain[a-1] is behind (tail side). Pull tail side forward: increase s of balls [0..a-1]
  const frontS = chain[a] ? chain[a].s : headS;
  // distance the tail block should move:
  // tail ball a-1 should be SPACING behind chain[a]
  let need = frontS - SPACING - chain[a - 1].s;
  if (need <= 0) return;
  // apply with "animation": we just set target s; smoothing in updateChain
  for (let i = 0; i <= a - 1; i++) {
    chain[i].targetS = chain[i].s + need;
  }
}

/* ---------------- chain advance & gap smoothing ---------------- */
function updateChain(dt) {
  if (chain.length === 0) return;
  // advance head toward pit
  const speedBoost = 1 + (spawned >= TOTAL_BALLS ? 0.15 : 0);
  headS += SPEED * speedBoost * dt;

  // enforce head position
  // maintain spacing from head backwards (tail follows)
  // first, apply smooth collapse targets
  for (let i = 0; i < chain.length; i++) {
    if (chain[i].targetS !== undefined) {
      const diff = chain[i].targetS - chain[i].s;
      if (Math.abs(diff) < 1) { chain[i].s = chain[i].targetS; delete chain[i].targetS; }
      else chain[i].s += diff * Math.min(1, dt * 14);
    }
  }

  // head ball takes headS
  chain[chain.length - 1].s = headS;

  // forward pass: keep spacing (tail pulled forward if gap collapsed / head moved)
  for (let i = chain.length - 2; i >= 0; i--) {
    const maxS = chain[i + 1].s - SPACING;
    // If there's a gap (chain[i+1].s - chain[i].s > SPACING + tolerance) and targetS set, handled above.
    // Normal follow: tail ball cannot be more than... it follows head: if gap exists, it stays;
    // but if chain[i].s > maxS (overlap), clamp down.
    if (chain[i].s > maxS) chain[i].s = maxS;
  }

  // detect lose: head ball at pit
  if (headS >= path.len - 2) {
    endGame(false);
    return;
  }

  // danger: if any ball s beyond len (shouldn't happen), clamp
  headS = chain[chain.length - 1].s;
}

/* ---------------- spawning tail balls ---------------- */
let spawnTimer = 0;
function updateSpawning(dt) {
  if (spawned >= TOTAL_BALLS) return;
  spawnTimer -= dt;
  if (spawnTimer > 0) return;
  spawnTimer = 1.4; // new ball every 1.4s
  const tailS = chain.length ? chain[0].s : 0;
  const newS = tailS - SPACING;
  // only spawn if there's room before path start (s >= -something); allow negative (feed in)
  chain.unshift({ color: randColor(), s: newS });
  spawned++;
  // avoid instant 3-run at tail
  if (chain.length >= 3 &&
      chain[0].color === chain[1].color && chain[1].color === chain[2].color) {
    let c; do { c = randColor(); } while (c === chain[1].color);
    chain[0].color = c;
  }
  updateHUD();
}

/* ---------------- aiming ---------------- */
function aimAt(x, y) {
  shooter.ang = Math.atan2(y - shooter.y, x - shooter.x);
}

function canvasPoint(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((clientX - rect.left) / rect.width) * W,
    y: ((clientY - rect.top) / rect.height) * H,
  };
}

canvas.addEventListener("mousemove", (e) => {
  if (state !== "playing") return;
  const p = canvasPoint(e.clientX, e.clientY);
  aimAt(p.x, p.y);
});
canvas.addEventListener("mousedown", (e) => {
  if (state !== "playing") return;
  e.preventDefault();
  const p = canvasPoint(e.clientX, e.clientY);
  aimAt(p.x, p.y);
  fire();
});
canvas.addEventListener("touchstart", (e) => {
  if (state !== "playing") return;
  e.preventDefault();
  const t = e.touches[0];
  const p = canvasPoint(t.clientX, t.clientY);
  aimAt(p.x, p.y);
}, { passive: false });
canvas.addEventListener("touchmove", (e) => {
  if (state !== "playing") return;
  e.preventDefault();
  const t = e.touches[0];
  const p = canvasPoint(t.clientX, t.clientY);
  aimAt(p.x, p.y);
}, { passive: false });
canvas.addEventListener("touchend", (e) => {
  if (state !== "playing") return;
  e.preventDefault();
  fire();
}, { passive: false });

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    if (state === "playing") setPause(true);
    else if (state === "paused") setPause(false);
  } else if (e.key === "q" || e.key === "Q") {
    swapShooter();
  } else if (e.key === "Escape") {
    if (state === "playing") setPause(true);
  }
});

/* ---------------- drawing ---------------- */
function drawPath() {
  ctx.save();
  ctx.lineWidth = BALL_R * 2 + 8;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  ctx.beginPath();
  const step = 12;
  for (let s = 0; s <= path.len; s += step) {
    const p = posAt(s);
    if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(88,166,255,0.18)";
  ctx.stroke();
  ctx.restore();

  // pit (goal hole) at end of path
  const pit = path.pit;
  const g = ctx.createRadialGradient(pit.x, pit.y, 4, pit.x, pit.y, 30);
  g.addColorStop(0, "#000");
  g.addColorStop(0.7, "#05070c");
  g.addColorStop(1, "rgba(248,81,73,0.35)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(pit.x, pit.y, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(248,81,73,0.6)";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawBall(x, y, color, r) {
  r = r || BALL_R - 2;
  const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  grad.addColorStop(0, lighten(color, 0.45));
  grad.addColorStop(1, darken(color, 0.35));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // highlight
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.beginPath();
  ctx.arc(x - r * 0.3, y - r * 0.35, r * 0.22, 0, Math.PI * 2);
  ctx.fill();
}

function lighten(hex, amt) { return shade(hex, amt); }
function darken(hex, amt) { return shade(hex, -amt); }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r = r + (255 - r) * amt; g = g + (255 - g) * amt; b = b + (255 - b) * amt; }
  else { r = r * (1 + amt); g = g * (1 + amt); b = b * (1 + amt); }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function drawShooter() {
  // base
  ctx.save();
  ctx.translate(shooter.x, shooter.y);
  // barrel
  ctx.rotate(shooter.ang);
  ctx.fillStyle = "#2b3550";
  ctx.strokeStyle = "#58a6ff";
  ctx.lineWidth = 2;
  const bw = 44, bh = 20;
  ctx.beginPath();
  ctx.roundRect(6, -bh / 2, bw, bh, 8);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // hub
  ctx.beginPath();
  ctx.fillStyle = "#1c2436";
  ctx.strokeStyle = "#58a6ff";
  ctx.lineWidth = 2.5;
  ctx.arc(shooter.x, shooter.y, 24, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // current ball in mouth
  if (current) {
    drawBall(shooter.x + Math.cos(shooter.ang) * 10, shooter.y + Math.sin(shooter.ang) * 10, current.color, 13);
  }
  // next ball (small, behind)
  if (next) {
    const nx = shooter.x - Math.cos(shooter.ang) * 34;
    const ny = shooter.y - Math.sin(shooter.ang) * 34;
    drawBall(nx, ny, next.color, 9);
  }

  // aim guide (dotted)
  ctx.save();
  ctx.setLineDash([3, 12]);
  ctx.strokeStyle = "rgba(88,166,255,0.35)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(shooter.x + Math.cos(shooter.ang) * 46, shooter.y + Math.sin(shooter.ang) * 46);
  ctx.lineTo(shooter.x + Math.cos(shooter.ang) * 260, shooter.y + Math.sin(shooter.ang) * 260);
  ctx.stroke();
  ctx.restore();
}

function drawFlying() {
  for (const b of flying) {
    drawBall(b.x, b.y, b.color);
  }
}

function drawChain() {
  // draw from tail to head so head overlaps correctly
  for (let i = 0; i < chain.length; i++) {
    const p = posAt(chain[i].s);
    if (p.x < -BALL_R * 2 || p.x > W + BALL_R * 2 || p.y < -BALL_R * 2 || p.y > H + BALL_R * 2) continue;
    drawBall(p.x, p.y, chain[i].color);
  }
}

function drawComboFlash() {
  if (comboTimer > 0 && combo > 1) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, comboTimer);
    ctx.fillStyle = "#d29922";
    ctx.font = "bold 34px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("COMBO x" + combo, W / 2, 70);
    ctx.restore();
  }
}

/* ---------------- main loop ---------------- */
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;

  if (state === "playing") {
    updateChain(dt);
    updateSpawning(dt);
    updateFlying(dt);
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 1;
    }
    updateHUD();
  }

  // draw
  ctx.save();
  if (shakeT > 0) {
    shakeT -= dt;
    const mag = 4 * (shakeT / 0.18);
    ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
  }
  ctx.clearRect(-10, -10, W + 20, H + 20);
  drawPath();
  drawChain();
  drawFlying();
  if (state === "playing" || state === "paused") drawShooter();
  drawComboFlash();
  ctx.restore();

  requestAnimationFrame(loop);
}

/* ---------------- game flow ---------------- */
const menuEl = document.getElementById("menu");
const pauseEl = document.getElementById("pause");
const resultEl = document.getElementById("result");

function openOverlay(el) { el.classList.add("open"); }
function closeOverlay(el) { el.classList.remove("open"); }

function startGame() {
  resetGame();
  state = "playing";
  closeOverlay(menuEl);
  closeOverlay(pauseEl);
  closeOverlay(resultEl);
  beep(440, 0.12, "sine", 0.05);
}

function setPause(p) {
  if (p && state === "playing") {
    state = "paused";
    openOverlay(pauseEl);
  } else if (!p && state === "paused") {
    state = "playing";
    closeOverlay(pauseEl);
    lastT = performance.now();
  }
}

function endGame(won) {
  state = "over";
  document.getElementById("resultTitle").textContent = won ? "🎉 你赢了！" : "💥 珠子进洞，失败";
  document.getElementById("resultScore").textContent = score;
  document.getElementById("resultMsg").textContent = won
    ? "全部珠子已消除，漂亮！"
    : "珠链抵达洞口。瞄准同色、制造连锁再来一局！";
  openOverlay(resultEl);
  beep(won ? 880 : 160, 0.3, won ? "sine" : "sawtooth", 0.07);
}

document.getElementById("btnStart").addEventListener("click", startGame);
document.getElementById("btnAgain").addEventListener("click", startGame);
document.getElementById("btnPauseRestart").addEventListener("click", startGame);
document.getElementById("btnResume").addEventListener("click", () => setPause(false));
document.getElementById("btnPause").addEventListener("click", () => {
  if (state === "playing") setPause(true);
  else if (state === "paused") setPause(false);
});
document.getElementById("btnRestart").addEventListener("click", () => {
  if (confirm("重新开始？")) startGame();
});
document.getElementById("btnMute").addEventListener("click", (e) => {
  muted = !muted;
  e.target.textContent = muted ? "🔇" : "🔊";
});

/* ---------------- responsive canvas ---------------- */
function fitCanvas() {
  const stage = document.getElementById("stage");
  const maxW = stage.clientWidth - 8;
  const maxH = stage.clientHeight - 8;
  const ratio = W / H;
  let cw = maxW, ch = cw / ratio;
  if (ch > maxH) { ch = maxH; cw = ch * ratio; }
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
}
window.addEventListener("resize", fitCanvas);

/* ---------------- boot ---------------- */
resetGame();
state = "menu";
openOverlay(menuEl);
fitCanvas();
requestAnimationFrame(loop);

// roundRect polyfill for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
</script>
