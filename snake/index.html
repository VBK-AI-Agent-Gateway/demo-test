<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: #e0f7fa;
  user-select: none;
  touch-action: none;
}
h1 { font-size: 2rem; margin-bottom: 12px; text-shadow: 0 0 12px #4dd0e1; letter-spacing: 4px; }
.panel { display: flex; gap: 24px; margin-bottom: 12px; font-size: 1.1rem; }
.panel span b { color: #ffd54f; font-family: monospace; font-size: 1.3rem; }
#board {
  background: rgba(0,0,0,0.35);
  border: 3px solid #4dd0e1;
  border-radius: 8px;
  box-shadow: 0 0 30px rgba(77,208,225,0.4);
}
.hint { margin-top: 12px; font-size: 0.9rem; opacity: 0.7; }
#overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 8px;
}
#overlay h2 { font-size: 2.4rem; color: #ff5252; margin-bottom: 8px; text-shadow: 0 0 16px #ff5252; }
#overlay p { font-size: 1.4rem; margin-bottom: 20px; }
#overlay button {
  padding: 12px 36px; font-size: 1.2rem; border: none; border-radius: 30px;
  background: linear-gradient(90deg, #4dd0e1, #00e676); color: #003;
  font-weight: bold; cursor: pointer; box-shadow: 0 4px 16px rgba(0,230,118,0.5);
  transition: transform .15s;
}
#overlay button:hover { transform: scale(1.08); }
.hidden { display: none !important; }
.wrap { position: relative; }
#dpad {
  display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px);
  gap: 6px; margin-top: 16px;
}
#dpad button {
  background: rgba(77,208,225,0.2); border: 2px solid #4dd0e1; color: #e0f7fa;
  font-size: 1.5rem; border-radius: 10px; cursor: pointer;
}
#dpad button:active { background: #4dd0e1; color: #003; }
#dpad .empty { background: none; border: none; }
</style>
</head>
<body>
<h1>贪吃蛇</h1>
<div class="panel">
  <span>得分 <b id="score">0</b></span>
  <span>最高 <b id="best">0</b></span>
  <span>速度 <b id="spd">1</b></span>
</div>
<div class="wrap">
  <canvas id="board" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">贪吃蛇</h2>
    <p id="ovMsg">方向键 / WASD 控制</p>
    <button id="ovBtn">开始游戏</button>
  </div>
</div>
<div class="hint">方向键 / WASD 移动 · 空格暂停 · 吃到食物加速</div>
<div id="dpad">
  <div class="empty"></div><button data-d="up">&#9650;</button><div class="empty"></div>
  <button data-d="left">&#9664;</button><div class="empty"></div><button data-d="right">&#9654;</button>
  <div class="empty"></div><button data-d="down">&#9660;</button><div class="empty"></div>
</div>

<script>
const cvs = document.getElementById('board');
const ctx = cvs.getContext('2d');
const CELL = 20, COLS = 20, ROWS = 20;
let snake, dir, nextDir, food, score, best, alive, paused, speed, timer;

best = +localStorage.getItem('snake_best') || 0;
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir;
  score = 0; alive = true; paused = false; speed = 1;
  placeFood();
  updateHUD();
  schedule();
}
function placeFood() {
  do {
    food = {x: (Math.random()*COLS)|0, y: (Math.random()*ROWS)|0};
  } while (snake.some(s => s.x===food.x && s.y===food.y));
}
function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('spd').textContent = speed;
}
function schedule() {
  clearInterval(timer);
  const ms = Math.max(70, 160 - (speed-1)*12);
  timer = setInterval(tick, ms);
}
function tick() {
  if (paused || !alive) return;
  dir = nextDir;
  const head = {x:(snake[0].x+dir.x+COLS)%COLS, y:(snake[0].y+dir.y+ROWS)%ROWS};
  if (snake.some(s => s.x===head.x && s.y===head.y)) {
    alive = false; gameOver(); return;
  }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score += 10;
    if (score % 50 === 0) speed++;
    placeFood(); updateHUD(); schedule();
  } else {
    snake.pop();
  }
  draw();
}
function draw() {
  ctx.clearRect(0,0,cvs.width,cvs.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  for (let i=0;i<=COLS;i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,ROWS*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(COLS*CELL,i*CELL); ctx.stroke();
  }
  ctx.fillStyle = '#ff5252';
  ctx.shadowColor = '#ff5252'; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-3, 0, Math.PI*2);
  ctx.fill(); ctx.shadowBlur = 0;
  snake.forEach((s,i) => {
    const t = i/snake.length;
    ctx.fillStyle = i===0 ? '#b2ff59' : 'rgb('+Math.floor(76+t*100)+','+Math.floor(208-t*60)+','+Math.floor(225-t*100)+')';
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
  });
}
function gameOver() {
  clearInterval(timer);
  if (score > best) {
    best = score;
    localStorage.setItem('snake_best', best);
    document.getElementById('best').textContent = best;
  }
  showOverlay('游戏结束', '得分 ' + score, '再来一局');
}
function showOverlay(title, msg, btn) {
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovMsg').textContent = msg;
  document.getElementById('ovBtn').textContent = btn;
  document.getElementById('overlay').classList.remove('hidden');
}
function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}
function setDir(d) {
  const map = {up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  const nd = map[d];
  if (!nd) return;
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
}
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const ks = {arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
  if (ks[k]) { e.preventDefault(); setDir(ks[k]); }
  if (k === ' ') { e.preventDefault(); togglePause(); }
  if (k === 'enter' && !alive) start();
});
function togglePause() {
  if (!alive) return;
  paused = !paused;
  if (paused) showOverlay('暂停', '按空格继续', '继续');
  else hideOverlay();
}
function start() {
  hideOverlay();
  reset();
  draw();
}
document.getElementById('ovBtn').addEventListener('click', () => {
  if (paused && alive) { paused = false; hideOverlay(); }
  else start();
});
document.querySelectorAll('#dpad button').forEach(b => {
  b.addEventListener('click', e => { e.preventDefault(); setDir(b.dataset.d); });
});
draw();
</script>
</body>
</html>
