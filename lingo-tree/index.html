<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingoTree · 日语和英语学习（中文界面）</title>
<meta name="description" content="以中文为底层语言的日语、英语学习应用：假名、词汇、语法、听力、拼句，带真人发音朗读，XP 与红心系统。">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="logo">Lingo<span>Tree</span> 🦉</div>
  <div class="progress-wrap" title="课程总进度"><div class="progress-bar" id="totalBar" style="width:0%"></div></div>
  <div class="spacer"></div>
  <div class="stat streak" title="连续学习天数"><span class="ic">🔥</span><span id="streakN">0</span></div>
  <div class="stat xp" title="经验值"><span class="ic">⚡</span><span id="xpN">0</span> 经验</div>
  <div class="stat hearts" title="红心（答错会扣）"><span class="ic">❤️</span><span id="heartN">5</span></div>
</header>

<div class="tabs" id="tabs">
  <button class="tab active" data-course="ja">🇯🇵 学日语</button>
  <button class="tab" data-course="en">🇬🇧 学英语</button>
  <button class="tab" data-course="stats">📊 学习统计</button>
</div>

<main>
  <div class="hint-bar" id="voiceHint">
    🔊 本应用带发音朗读：题目、单词会用日语/英语读出来，点 🔊 按钮可随时重听。
    <button class="voice-test" id="voiceTest">测试发音</button>
  </div>
  <div class="daily" id="dailyBox">
    <div class="d-card"><b id="dayXp">0</b><span>今日经验</span></div>
    <div class="d-card"><b id="dayGoal">30</b><span>每日目标</span></div>
    <div class="d-card"><b id="dayLessons">0</b><span>今日课时</span></div>
    <div class="d-card"><b id="dayStreak">🔥 0</b><span>连续天数</span></div>
  </div>
  <div id="pathBox"></div>
  <div id="statsBox" style="display:none"></div>
</main>

<!-- 练习全屏层 -->
<div class="overlay" id="overlay">
  <div class="q-top">
    <button class="close-x" id="closeBtn" aria-label="退出练习">✕</button>
    <div class="q-progress"><i id="qBar" style="width:0%"></i></div>
    <div class="hearts-bar">❤️ <span id="qHearts">5</span></div>
  </div>
  <div class="q-body" id="qBody"></div>
  <div class="result" id="resultBox">
    <div class="big" id="resIcon">🎉</div>
    <h1 id="resTitle">课程完成！</h1>
    <div class="gain" id="resGain"></div>
    <button class="next-btn" id="resBtn">继续</button>
  </div>
  <div class="q-foot" id="qFoot" style="display:none">
    <div class="fb-title" id="fbTitle"></div>
    <div class="fb-tip" id="fbTip"></div>
    <button class="next-btn" id="checkBtn">继续</button>
  </div>
</div>

<!-- 红心耗尽弹窗 -->
<div class="modal" id="heartsModal">
  <div class="modal-card">
    <h3>💔 红心用完了</h3>
    <p>休息一下，红心每 30 分钟恢复 1 颗（上限 5 颗）。<br>学习应用，随时可以免费补满继续学。</p>
    <div class="row">
      <button class="ghost-btn" id="waitBtn">稍后再来</button>
      <button class="next-btn" id="refillBtn" style="flex:1">免费补满 ❤️</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
