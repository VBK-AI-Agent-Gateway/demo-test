# docker-compose.test.yml — Redis + Jest integration suite
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  test:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: test
      MAX_ATTEMPTS: "3"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "npm install &&
             npx jest --runInBand --forceExit"