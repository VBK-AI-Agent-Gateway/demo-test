<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 Snake</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:"Segoe UI",system-ui,sans-serif; color:#e0f7fa;
    user-select:none;
  }
  h1 { margin-bottom:12px; letter-spacing:6px; text-shadow:0 0 12px #00e5ff; }
  .hud { display:flex; gap:24px; margin-bottom:10px; font-size:18px; }
  .hud span b { color:#ffd54f; }
  canvas {
    background:rgba(0,0,0,.45); border:2px solid #00e5ff;
    border-radius:8px; box-shadow:0 0 24px rgba(0,229,255,.35);
  }
  .tip { margin-top:12px; font-size:14px; opacity:.75; }
  #overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.72);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    gap:16px; text-align:center;
  }
  #overlay.show { display:flex; }
  #overlay h2 { font-size:34px; color:#ff5252; text-shadow:0 0 14px #ff1744; }
  #overlay p { font-size:18px; }
  button {
    padding:10px 28px; font-size:18px; border:none; border-radius:24px;
    background:#00e5ff; color:#00343a; cursor:pointer; font-weight:bold;
    box-shadow:0 0 16px rgba(0,229,255,.6); transition:transform .15s;
  }
  button:hover { transform:scale(1.07); }
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div class="hud">
  <span>得分：<b id="score">0</b></span>
  <span>最高分：<b id="best">0</b></span>
  <span>速度：<b id="spd">1</b></span>
</div>
<canvas id="cv" width="440" height="440"></canvas>
<div class="tip">方向键 / WASD 移动 · 空格 暂停 · P 换主题</div>

<div id="overlay">
  <h2 id="ovTitle">游戏结束</h2>
  <p id="ovMsg"></p>
  <button id="btn">重新开始</button>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const N = 22, CELL = cv.width / N;
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const spdEl = document.getElementById('spd');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovMsg = document.getElementById('ovMsg');
const btn = document.getElementById('btn');

const THEMES = [
  { body:'#00e676', head:'#69f0ae', food:'#ff5252', grid:'rgba(255,255,255,.05)' },
  { body:'#ffd740', head:'#ffe57f', food:'#e040fb', grid:'rgba(255,255,255,.06)' },
  { body:'#40c4ff', head:'#80d8ff', food:'#ff6e40', grid:'rgba(255,255,255,.05)' },
];
let themeIdx = 0;

let snake, dir, nextDir, food, score, best, alive, paused, timer, speed;
best = +(localStorage.getItem('snake_best') || 0);
bestEl.textContent = best;

function reset() {
  snake = [{x:11,y:11},{x:10,y:11},{x:9,y:11}];
  dir = {x:1,y:0}; nextDir = dir;
  score = 0; alive = true; paused = false; speed = 1;
  scoreEl.textContent = 0; spdEl.textContent = 1;
  placeFood();
  overlay.classList.remove('show');
  loop();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N) };
  } while (snake.some(s => s.x===food.x && s.y===food.y));
}

function loop() {
  clearInterval(timer);
  const ms = Math.max(70, 180 - (speed-1)*12);
  timer = setInterval(step, ms);
}

function step() {
  if (!alive || paused) return;
  dir = nextDir;
  const head = { x:(snake[0].x+dir.x+N)%N, y:(snake[0].y+dir.y+N)%N };
  if (snake.some(s => s.x===head.x && s.y===head.y)) return die();
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score % 50 === 0) { speed++; spdEl.textContent = speed; loop(); }
    placeFood();
  } else snake.pop();
  draw();
}

function die() {
  alive = false;
  clearInterval(timer);
  if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snake_best', best); }
  ovTitle.textContent = '💀 游戏结束';
  ovMsg.textContent = `本局得分 ${score} · 最高 ${best}`;
  btn.textContent = '再来一局';
  overlay.classList.add('show');
}

function draw() {
  const t = THEMES[themeIdx];
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.strokeStyle = t.grid;
  for (let i=1;i<N;i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(cv.width,i*CELL); ctx.stroke();
  }
  // food
  ctx.fillStyle = t.food;
  ctx.shadowColor = t.food; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.36, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // snake
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? t.head : t.body;
    ctx.globalAlpha = i===0 ? 1 : Math.max(0.4, 1 - i/(snake.length*1.4));
    const p = i===0 ? 1 : 2;
    roundRect(s.x*CELL+p/2, s.y*CELL+p/2, CELL-p, CELL-p, i===0?7:5);
  });
  ctx.globalAlpha = 1;
  if (paused && alive) {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ 已暂停 (空格继续)', cv.width/2, cv.height/2);
  }
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath(); ctx.fill();
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = {
    arrowup:{x:0,y:-1}, w:{x:0,y:-1},
    arrowdown:{x:0,y:1}, s:{x:0,y:1},
    arrowleft:{x:-1,y:0}, a:{x:-1,y:0},
    arrowright:{x:1,y:0}, d:{x:1,y:0},
  };
  if (map[k]) {
    e.preventDefault();
    const d = map[k];
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d; // 禁止直接掉头
  } else if (k === ' ') {
    e.preventDefault();
    if (alive) { paused = !paused; draw(); }
  } else if (k === 'p') {
    themeIdx = (themeIdx+1) % THEMES.length;
    draw();
  }
});

btn.addEventListener('click', reset);
reset(); draw();
</script>
</body>
</html>
