<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 小游戏</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #333;
  }
  h1 {
    color: #fff;
    font-size: 56px;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    margin-bottom: 8px;
  }
  .sub {
    color: rgba(255,255,255,0.85);
    margin-bottom: 20px;
    font-size: 15px;
  }
  .panel {
    background: #bbada0;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .scores {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .score-box {
    background: #9c8a7c;
    border-radius: 6px;
    padding: 8px 18px;
    text-align: center;
    color: #fff;
    flex: 1;
    min-width: 100px;
  }
  .score-box .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.8;
  }
  .score-box .value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 2px;
  }
  .btns {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  button {
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  button:hover { background: #9f8b77; transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  .board {
    position: relative;
    background: #bbada0;
    border-radius: 8px;
    width: 420px;
    height: 420px;
    padding: 12px;
    touch-action: none;
  }
  .bg-cell, .tile {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 6px;
  }
  .bg-cell { background: rgba(238,228,218,0.35); }
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    transition: top 0.12s ease, left 0.12s ease;
    z-index: 2;
  }
  .tile.pop { animation: pop 0.18s ease; }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0.4; }
    100% { transform: scale(1); opacity: 1; }
  }
  .tile-2    { background:#eee4da; color:#776e65; font-size:44px; }
  .tile-4    { background:#ede0c8; color:#776e65; font-size:44px; }
  .tile-8    { background:#f2b179; color:#f9f6f2; font-size:44px; }
  .tile-16   { background:#f59563; color:#f9f6f2; font-size:40px; }
  .tile-32   { background:#f67c5f; color:#f9f6f2; font-size:40px; }
  .tile-64   { background:#f65e3b; color:#f9f6f2; font-size:40px; }
  .tile-128  { background:#edcf72; color:#f9f6f2; font-size:34px; box-shadow:0 0 18px rgba(243,215,116,0.5); }
  .tile-256  { background:#edcc61; color:#f9f6f2; font-size:34px; box-shadow:0 0 20px rgba(243,215,116,0.55); }
  .tile-512  { background:#edc850; color:#f9f6f2; font-size:34px; box-shadow:0 0 22px rgba(243,215,116,0.6); }
  .tile-1024 { background:#edc53f; color:#f9f6f2; font-size:28px; box-shadow:0 0 24px rgba(243,215,116,0.65); }
  .tile-2048 { background:#edc22e; color:#f9f6f2; font-size:28px; box-shadow:0 0 30px rgba(243,215,116,0.8); }
  .tile-super{ background:#3c3a32; color:#f9f6f2; font-size:24px; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238,228,218,0.75);
    border-radius: 8px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    animation: fade 0.4s ease;
  }
  .overlay.show { display: flex; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .overlay .msg {
    font-size: 48px;
    font-weight: 800;
    color: #776e65;
    margin-bottom: 16px;
  }
  .overlay.lose { background: rgba(238,228,218,0.85); }
  .overlay.lose .msg { color: #bb2b0b; }
  .hint {
    color: rgba(255,255,255,0.9);
    margin-top: 16px;
    font-size: 14px;
    text-align: center;
    line-height: 1.6;
  }
  kbd {
    background: rgba(255,255,255,0.25);
    padding: 1px 7px;
    border-radius: 4px;
    font-family: inherit;
  }
</style>
</head>
<body>
  <h1>2048</h1>
  <div class="sub">合并数字，冲击 2048！</div>

  <div class="panel">
    <div class="scores">
      <div class="score-box"><div class="label">分数</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">最佳</div><div class="value" id="best">0</div></div>
    </div>
    <div class="btns">
      <button id="newGame">新游戏</button>
      <button id="undoBtn">撤回一步</button>
    </div>
    <div class="board" id="board">
      <div class="overlay" id="overlay">
        <div class="msg" id="overlayMsg">游戏结束</div>
        <button id="retryBtn">再来一局</button>
      </div>
    </div>
  </div>

  <div class="hint">
    使用 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动，手机上可滑动屏幕
  </div>

<script>
(function () {
  const SIZE = 4;
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlayMsg');
  const CELL = 90, GAP = 12, OFFSET = 12;

  let grid, score, best, over, won, history, animating;

  best = parseInt(localStorage.getItem('best2048') || '0', 10);
  bestEl.textContent = best;

  function pos(i) { return OFFSET + i * (CELL + GAP); }

  function initBackground() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const bg = document.createElement('div');
        bg.className = 'bg-cell';
        bg.style.left = pos(c) + 'px';
        bg.style.top  = pos(r) + 'px';
        boardEl.appendChild(bg);
      }
    }
  }

  function emptyCells() {
    const out = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) out.push([r, c]);
    return out;
  }

  function addRandom() {
    const cells = emptyCells();
    if (!cells.length) return;
    const [r, c] = cells[Math.floor(Math.random() * cells.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return [r, c];
  }

  function tileClass(v) {
    return v <= 2048 ? 'tile-' + v : 'tile-super';
  }

  function render(newCells) {
    boardEl.querySelectorAll('.tile').forEach(t => t.remove());
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (!v) continue;
        const t = document.createElement('div');
        t.className = 'tile ' + tileClass(v);
        t.style.left = pos(c) + 'px';
        t.style.top  = pos(r) + 'px';
        t.textContent = v;
        if (newCells && newCells.some(x => x[0] === r && x[1] === c)) t.classList.add('pop');
        boardEl.appendChild(t);
      }
    }
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('best2048', String(best));
      bestEl.textContent = best;
    }
  }

  function snapshot() {
    return { grid: grid.map(row => row.slice()), score: score };
  }

  function restore(s) {
    grid = s.grid.map(row => row.slice());
    score = s.score;
    render();
    hideOverlay();
    over = false;
  }

  function slideLeft(row) {
    const arr = row.filter(v => v !== 0);
    const out = [];
    let gained = 0;
    for (let i = 0; i < arr.length; i++) {
      if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
        out.push(arr[i] * 2);
        gained += arr[i] * 2;
        i++;
      } else {
        out.push(arr[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    const moved = out.some((v, i) => v !== row[i]);
    return { row: out, gained, moved };
  }

  function rotateCW(g) {
    const n = g.map(r => r.slice());
    const res = [];
    for (let c = 0; c < SIZE; c++) {
      res[c] = [];
      for (let r = SIZE - 1; r >= 0; r--) res[c][SIZE - 1 - r] = n[r][c];
    }
    return res;
  }

  // dir: 0=left 1=up 2=right 3=down
  function move(dir) {
    if (over || animating) return;
    const prev = snapshot();
    let g = grid.map(r => r.slice());
    let rotations = dir;
    for (let i = 0; i < rotations; i++) g = rotateCW(g);

    let gained = 0, moved = false;
    for (let r = 0; r < SIZE; r++) {
      const res = slideLeft(g[r]);
      g[r] = res.row;
      gained += res.gained;
      if (res.moved) moved = true;
    }

    for (let i = 0; i < (4 - rotations) % 4; i++) g = rotateCW(g);

    if (!moved) return;

    grid = g;
    score += gained;
    history = prev;
    const nc = addRandom();
    render(nc);
    enableUndo();

    if (!won && grid.some(row => row.some(v => v >= 2048))) {
      won = true;
      showOverlay('胜利！🎉', false);
      over = true;
      return;
    }
    if (isGameOver()) {
      over = true;
      showOverlay('游戏结束', true);
    }
  }

  function isGameOver() {
    if (emptyCells().length) return false;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (c + 1 < SIZE && grid[r][c + 1] === v) return false;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return false;
      }
    return true;
  }

  function showOverlay(msg, isLose) {
    overlayMsg.textContent = msg;
    overlay.classList.toggle('lose', !!isLose);
    overlay.classList.add('show');
  }
  function hideOverlay() {
    overlay.classList.remove('show', 'lose');
  }

  function enableUndo() {
    const b = document.getElementById('undoBtn');
    b.disabled = false;
    b.style.opacity = 1;
  }
  function disableUndo() {
    const b = document.getElementById('undoBtn');
    b.disabled = true;
    b.style.opacity = 0.5;
  }

  function newGame() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    over = false;
    won = false;
    history = null;
    animating = false;
    hideOverlay();
    disableUndo();
    addRandom();
    addRandom();
    render();
  }

  const keyMap = {
    ArrowLeft: 0, a: 0, A: 0,
    ArrowUp: 1, w: 1, W: 1,
    ArrowRight: 2, d: 2, D: 2,
    ArrowDown: 3, s: 3, S: 3
  };
  document.addEventListener('keydown', e => {
    if (e.key in keyMap) {
      e.preventDefault();
      move(keyMap[e.key]);
    }
  });

  // touch / swipe
  let tsX = 0, tsY = 0, tracking = false;
  boardEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    tsX = e.touches[0].clientX;
    tsY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });
  boardEl.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - tsX;
    const dy = e.changedTouches[0].clientY - tsY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0);
    else move(dy > 0 ? 3 : 1);
  }, { passive: true });

  let msX = 0, msY = 0, mDown = false;
  boardEl.addEventListener('mousedown', e => { mDown = true; msX = e.clientX; msY = e.clientY; });
  boardEl.addEventListener('mouseup', e => {
    if (!mDown) return;
    mDown = false;
    const dx = e.clientX - msX, dy = e.clientY - msY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0);
    else move(dy > 0 ? 3 : 1);
  });

  document.getElementById('newGame').addEventListener('click', newGame);
  document.getElementById('retryBtn').addEventListener('click', newGame);
  document.getElementById('undoBtn').addEventListener('click', () => {
    if (history) {
      restore(history);
      history = null;
      disableUndo();
    }
  });

  initBackground();
  newGame();
})();
</script>
</body>
</html>
