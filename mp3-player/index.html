<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星伴音乐 · MP3 播放器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh; color:#eef2ff;
    background:radial-gradient(900px 500px at 20% -10%, #2a1b4d 0%, #0c1024 55%);
    display:flex; flex-direction:column; align-items:center; padding:28px 16px 40px;
  }
  h1 { font-size:1.5rem; letter-spacing:3px; margin-bottom:4px; }
  h1 span { color:#22d3ee; }
  .sub { color:#8b97c2; font-size:.85rem; margin-bottom:22px; text-align:center; }

  .player {
    width:100%; max-width:460px;
    background:rgba(18,26,51,.85); border:1px solid #223059;
    border-radius:22px; padding:26px; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .cover-wrap { position:relative; width:190px; height:190px; margin:0 auto 18px; }
  .cover {
    width:190px; height:190px; border-radius:50%;
    background:conic-gradient(from 0deg,#5b8cff,#22d3ee,#34d399,#f472b6,#5b8cff);
    display:flex; align-items:center; justify-content:center;
    font-size:4rem; box-shadow:0 0 0 8px #0e1530, 0 0 40px rgba(91,140,255,.35);
    animation:spin 8s linear infinite; animation-play-state:paused;
  }
  .cover.play { animation-play-state:running; }
  .cover::after {
    content:''; position:absolute; width:44px; height:44px; border-radius:50%;
    background:#0e1530; border:3px solid #223059; top:50%; left:50%; transform:translate(-50%,-50%);
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .title { font-size:1.15rem; font-weight:800; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .artist { color:#8b97c2; font-size:.85rem; margin-bottom:16px; }
  .bar { position:relative; height:6px; background:#223059; border-radius:99px; cursor:pointer; margin-bottom:6px; }
  .bar .fill { position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg,#5b8cff,#22d3ee); border-radius:99px; }
  .bar .knob { position:absolute; top:50%; width:14px; height:14px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); left:0%; box-shadow:0 0 8px #22d3ee; }
  .time { display:flex; justify-content:space-between; font-size:.75rem; color:#8b97c2; font-family:monospace; margin-bottom:16px; }
  .ctrl { display:flex; align-items:center; justify-content:center; gap:18px; }
  .ctrl button { background:none; border:none; color:#eef2ff; cursor:pointer; font-size:1.4rem; width:44px; height:44px; border-radius:50%; transition:.15s; }
  .ctrl button:hover { background:#223059; }
  .ctrl .play { width:64px; height:64px; font-size:1.7rem; background:linear-gradient(135deg,#5b8cff,#22d3ee); color:#081020; }
  .ctrl .play:hover { filter:brightness(1.12); }
  .extras { display:flex; align-items:center; justify-content:space-between; margin-top:18px; gap:10px; }
  .vol { display:flex; align-items:center; gap:8px; flex:1; }
  .vol input { flex:1; accent-color:#22d3ee; }
  .pill { background:#0e1530; border:1px solid #223059; color:#8b97c2; border-radius:999px; padding:5px 13px; font-size:.78rem; cursor:pointer; }
  .pill.on { color:#34d399; border-color:#34d399; }

  .list-wrap { width:100%; max-width:460px; margin-top:20px; }
  .list-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .list-head b { font-size:.95rem; }
  .list-head .ops { display:flex; gap:8px; }
  .list-head button { background:#121a33; border:1px solid #223059; color:#aeb9e6; border-radius:8px; padding:6px 12px; font-size:.8rem; cursor:pointer; }
  .list-head button:hover { border-color:#5b8cff; color:#fff; }
  .empty { border:1px dashed #223059; border-radius:14px; padding:26px 16px; text-align:center; color:#8b97c2; font-size:.86rem; line-height:1.9; }
  ul.list { list-style:none; }
  ul.list li {
    display:flex; align-items:center; gap:12px; padding:11px 14px;
    background:rgba(18,26,51,.7); border:1px solid #223059;
    border-radius:12px; margin-bottom:8px; cursor:pointer; transition:.15s;
  }
  ul.list li:hover { border-color:#5b8cff; }
  ul.list li.cur { border-color:#22d3ee; background:rgba(34,211,238,.08); }
  ul.list li .idx { color:#5b6aa3; font-size:.78rem; width:20px; text-align:center; font-family:monospace; }
  ul.list li .info { flex:1; min-width:0; }
  ul.list li .nm { font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  ul.list li .ar { font-size:.74rem; color:#8b97c2; }
  ul.list li .dur { font-size:.76rem; color:#5b6aa3; font-family:monospace; }
  ul.list li .del { background:none; border:none; color:#5b6aa3; cursor:pointer; font-size:.95rem; }
  ul.list li .del:hover { color:#f87171; }
  .playing-eq { display:inline-block; color:#22d3ee; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .tip { color:#5b6aa3; font-size:.75rem; margin-top:16px; text-align:center; max-width:460px; line-height:1.8; }
  input[type=file] { display:none; }
  #err { color:#f87171; font-size:.8rem; min-height:1.1em; margin-top:8px; }
</style>
</head>
<body>

<h1>🎵 星伴<span>音乐</span> · MP3</h1>
<div class="sub">本地 MP3 播放器 + 世界名曲曲库 · 歌曲不上传，只留在你的浏览器里</div>

<div class="player">
  <div class="cover-wrap"><div class="cover" id="cover">🎵</div></div>
  <div class="title" id="title">未播放</div>
  <div class="artist" id="artist">先添加 MP3，或从下方曲库点歌</div>
  <div class="bar" id="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
  <div class="time"><span id="cur">00:00</span><span id="dur">00:00</span></div>
  <div class="ctrl">
    <button id="modeBtn" title="播放模式">🔁</button>
    <button onclick="prev()" title="上一首">⏮</button>
    <button class="play" onclick="toggle()" id="playBtn">▶</button>
    <button onclick="next()" title="下一首">⏭</button>
    <button onclick="document.getElementById('file').click()" title="添加歌曲">＋</button>
  </div>
  <div class="extras">
    <div class="vol">🔊<input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></div>
    <button class="pill" id="randBtn" onclick="toggleRand()">🔀 随机</button>
  </div>
  <div id="err"></div>
</div>

<div class="list-wrap">
  <div class="list-head">
    <b>📜 我的播放列表 <span id="count" style="color:#5b6aa3;font-weight:400">(0)</span></b>
    <div class="ops">
      <button onclick="document.getElementById('file').click()">＋ 添加 MP3</button>
      <button onclick="clearList()">清空</button>
    </div>
  </div>
  <div class="empty" id="empty">还没有歌曲～<br>点上方「＋ 添加 MP3」选本地文件（可多选、可拖拽），<br>或从下方「世界名曲」点歌试听</div>
  <ul class="list" id="list" style="display:none"></ul>
</div>

<div class="list-wrap">
  <div class="list-head">
    <b>🌍 世界名曲曲库 <span id="wcount" style="color:#5b6aa3;font-weight:400"></span></b>
    <div class="ops"><button onclick="addAllWorld()">＋ 全部加入列表</button></div>
  </div>
  <div class="empty" id="worldStatus">正在加载曲库…</div>
  <ul class="list" id="worldList" style="display:none"></ul>
</div>

<input type="file" id="file" accept="audio/*" multiple>
<div class="tip">提示：MP3 / WAV / M4A / OGG 均可。世界名曲来自网络公版音频源，若你的网络访问不了外站，曲库会显示加载失败——用本地 MP3 即可正常播放。</div>
<audio id="audio"></audio>

<script>
const audio = document.getElementById('audio');
let playlist = [];
let idx = -1;
let mode = 'list';
let rand = false;
const errBox = document.getElementById('err');
function setErr(m) { errBox.textContent = m || ''; }

/* ================= 世界名曲曲库 ================= */
const WORLD = [
  { name:'月光奏鸣曲 第一乐章', artist:'贝多芬', url:'https://upload.wikimedia.org/wikipedia/commons/6/62/Beeethoven_Moonlight_1st_movement.ogg' },
  { name:'致爱丽丝 (Für Elise)', artist:'贝多芬', url:'https://upload.wikimedia.org/wikipedia/commons/d/d3/Beethoven_Fur_Elise.ogg' },
  { name:'欢乐颂 (Ode to Joy)', artist:'贝多芬', url:'https://upload.wikimedia.org/wikipedia/commons/8/81/Beethoven_Symphony_9_4th_movement_Ode_to_Joy.ogg' },
  { name:'土耳其进行曲', artist:'莫扎特', url:'https://upload.wikimedia.org/wikipedia/commons/f/f8/Mozart_-_Rondo_alla_Turca.ogg' },
  { name:'小星星变奏曲', artist:'莫扎特', url:'https://upload.wikimedia.org/wikipedia/commons/2/27/Mozart_-_Twinkle_Twinkle_Little_Star_Variations.ogg' },
  { name:'费加罗的婚礼 序曲', artist:'莫扎特', url:'https://upload.wikimedia.org/wikipedia/commons/4/40/Mozart_Le_Nozze_di_Figaro_Ouverture.ogg' },
  { name:'G弦上的咏叹调', artist:'巴赫', url:'https://upload.wikimedia.org/wikipedia/commons/2/2e/Bach_Air_on_the_G_String.ogg' },
  { name:'卡农 (Canon in D)', artist:'帕赫贝尔', url:'https://upload.wikimedia.org/wikipedia/commons/6/63/Pachelbel_Canon.ogg' },
  { name:'天鹅湖 · 主题', artist:'柴可夫斯基', url:'https://upload.wikimedia.org/wikipedia/commons/9/9c/Tchaikovsky_-_Swan_Lake_-_Theme.ogg' },
  { name:'蓝色多瑙河', artist:'约翰·施特劳斯', url:'https://upload.wikimedia.org/wikipedia/commons/9/9a/Johann_Strauss_II_-_An_der_sch%C3%B6nen_blauen_Donau.ogg' },
  { name:'四季 · 春 第一乐章', artist:'维瓦尔第', url:'https://upload.wikimedia.org/wikipedia/commons/4/4d/Vivaldi_-_Four_Seasons_-_Spring_1st_movement.ogg' },
  { name:'野蜂飞舞', artist:'穆索尔斯基', url:'https://upload.wikimedia.org/wikipedia/commons/8/8a/Rimsky-Korsakov_Flight_of_the_Bumblebee.ogg' },
  { name:'婚礼进行曲', artist:'瓦格纳', url:'https://upload.wikimedia.org/wikipedia/commons/2/24/Wagner_Bridal_Chorus.ogg' },
  { name:'哈巴涅拉 (Habanera)', artist:'比才', url:'https://upload.wikimedia.org/wikipedia/commons/8/8b/Bizet_Habanera.ogg' },
  { name:'威廉·退尔 序曲', artist:'罗西尼', url:'https://upload.wikimedia.org/wikipedia/commons/9/93/Rossini_William_Tell_Overture.ogg' },
  { name:'哈利路亚 (Hallelujah)', artist:'亨德尔', url:'https://upload.wikimedia.org/wikipedia/commons/2/2b/Handel_-_Messiah_-_Hallelujah.ogg' },
  { name:'爱的致意 (Salut d\'Amour)', artist:'埃尔加', url:'https://upload.wikimedia.org/wikipedia/commons/6/6e/Elgar_Salut_d_Amour.ogg' },
  { name:'绿袖子 (Greensleeves)', artist:'英国民谣', url:'https://upload.wikimedia.org/wikipedia/commons/1/1d/Greensleeves.ogg' },
  { name:'奇异恩典 (Amazing Grace)', artist:'美国福音歌曲', url:'https://upload.wikimedia.org/wikipedia/commons/6/6b/Amazing_Grace.ogg' },
  { name:'友谊地久天长 (Auld Lang Syne)', artist:'苏格兰民歌', url:'https://upload.wikimedia.org/wikipedia/commons/8/83/Auld_Lang_Syne.ogg' },
  { name:'铃儿响叮当 (Jingle Bells)', artist:'James Pierpont', url:'https://upload.wikimedia.org/wikipedia/commons/6/6d/Jingle_Bells.ogg' },
  { name:'平安夜 (Silent Night)', artist:'传统圣诞歌曲', url:'https://upload.wikimedia.org/wikipedia/commons/7/7c/Silent_Night.ogg' },
];

// 先用 5 秒超时的 HEAD 探测曲库源是否可达；不可达也照样把名单显示出来
function probeWorld() {
  const st = document.getElementById('worldStatus');
  const test = WORLD[0].url;
  const ctrl = new AbortController();
  const tm = setTimeout(() => ctrl.abort(), 5000);
  fetch(test, { method:'GET', signal: ctrl.signal, headers:{ Range:'bytes=0-64' } })
    .then(r => { clearTimeout(tm); renderWorld(r.ok || r.status === 206 ? true : false); })
    .catch(() => { clearTimeout(tm); renderWorld(false); });
}
function renderWorld(ok) {
  const ul = document.getElementById('worldList');
  const st = document.getElementById('worldStatus');
  document.getElementById('wcount').textContent = '(' + WORLD.length + ')';
  st.innerHTML = ok
    ? '✅ 曲库源可达，点击任意一首即可试听'
    : '⚠️ 当前网络访问不了曲库源（外站音频被拦），名单照常显示；点歌可能无声，' +
      '<b style="color:#fbbf24">建议用「＋ 添加 MP3」放本地文件</b>——本地播放完全正常。';
  st.style.color = ok ? '#34d399' : '#fbbf24';
  st.style.borderColor = ok ? '#34d399' : '#fbbf24';
  st.style.display = 'block';
  ul.innerHTML = '';
  WORLD.forEach((t, i) => {
    const li = document.createElement('li');
    li.innerHTML =
      '<span class="idx">' + (i + 1) + '</span>' +
      '<span class="info"><div class="nm">' + esc(t.name) + '</div><div class="ar">' + esc(t.artist) + '</div></span>' +
      '<button class="del" title="加入我的列表" style="width:auto;font-size:.76rem;color:#34d399">＋ 加入</button>';
    li.onclick = () => playWorld(i);
    li.querySelector('button').onclick = e => {
      e.stopPropagation();
      if (!playlist.some(x => x.url === t.url)) playlist.push({ name:t.name, artist:t.artist, url:t.url, dur:0 });
      renderList();
      toast('已加入列表：' + t.name);
    };
    ul.appendChild(li);
  });
  ul.style.display = 'block';
}
function addAllWorld() {
  WORLD.forEach(t => { if (!playlist.some(x => x.url === t.url)) playlist.push({ name:t.name, artist:t.artist, url:t.url, dur:0 }); });
  renderList();
  toast('已把 ' + WORLD.length + ' 首加入列表');
}
function playWorld(i) {
  const t = WORLD[i];
  setErr('');
  audio.loop = false;
  audio.src = t.url;
  audio.play().then(() => {
    document.getElementById('cover').classList.add('play');
    document.getElementById('playBtn').textContent = '⏸';
    document.getElementById('title').textContent = t.name;
    document.getElementById('artist').textContent = t.artist + ' · 世界名曲';
    document.getElementById('dur').textContent = '--:--';
    renderList();
  }).catch(() => {
    setErr('这首加载失败：当前网络访问不了曲库源（外站被拦）。请用「＋ 添加 MP3」放本地文件，本地播放正常。');
    toast('⚠️ 曲库源不可达');
  });
}
audio.onerror = () => {
  if (audio.src && !audio.src.startsWith('blob:')) {
    setErr('曲库音频加载失败（网络拦截外站）。本地 MP3 不受影响，请点「＋ 添加 MP3」。');
  }
};

/* ================= 本地文件 ================= */
document.getElementById('file').onchange = e => addFiles(e.target.files);
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); addFiles(e.dataTransfer.files); });

function addFiles(files) {
  const arr = [...files].filter(f => f.type.startsWith('audio') || /\.(mp3|wav|m4a|ogg|flac|aac)$/i.test(f.name));
  if (!arr.length) return toast('没找到音频文件');
  setErr('');
  arr.forEach(f => {
    let name = f.name.replace(/\.[^.]+$/, '');
    let artist = '本地文件';
    const m = name.split(/\s*-\s*/);
    if (m.length >= 2) { artist = m[0]; name = m.slice(1).join(' - '); }
    playlist.push({ name, artist, url: URL.createObjectURL(f), dur: 0 });
  });
  renderList();
  if (idx === -1) play(playlist.length - arr.length);
  toast('已添加 ' + arr.length + ' 首');
}

/* ================= 控制 ================= */
function play(i) {
  if (!playlist.length) return;
  idx = (i + playlist.length) % playlist.length;
  audio.loop = mode === 'one';
  audio.src = playlist[idx].url;
  audio.play().catch(() => setErr('这首播放失败，试试下一首'));
  document.getElementById('cover').classList.add('play');
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('title').textContent = playlist[idx].name;
  document.getElementById('artist').textContent = playlist[idx].artist;
  renderList();
}
function toggle() {
  if (idx === -1) { if (playlist.length) play(0); else toast('先添加歌曲或从曲库点歌'); return; }
  if (audio.paused) { audio.play().catch(()=>{}); document.getElementById('playBtn').textContent='⏸'; document.getElementById('cover').classList.add('play'); }
  else { audio.pause(); document.getElementById('playBtn').textContent='▶'; document.getElementById('cover').classList.remove('play'); }
}
function next() { if (!playlist.length) return toast('播放列表是空的'); rand ? play(Math.floor(Math.random()*playlist.length)) : play(idx + 1); }
function prev() {
  if (!playlist.length) return toast('播放列表是空的');
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  rand ? play(Math.floor(Math.random()*playlist.length)) : play(idx - 1);
}
function toggleRand() { rand = !rand; document.getElementById('randBtn').classList.toggle('on', rand); }
document.getElementById('modeBtn').onclick = () => {
  mode = mode === 'list' ? 'one' : 'list';
  audio.loop = mode === 'one';
  document.getElementById('modeBtn').textContent = mode === 'one' ? '🔂' : '🔁';
  toast(mode === 'one' ? '单曲循环' : '列表循环');
};
audio.onended = () => { if (playlist.length) mode === 'one' ? play(idx) : next(); else { audio.pause(); } };
audio.ontimeupdate = () => {
  const p = audio.duration ? audio.currentTime / audio.duration * 100 : 0;
  document.getElementById('fill').style.width = p + '%';
  document.getElementById('knob').style.left = p + '%';
  document.getElementById('cur').textContent = fmt(audio.currentTime);
  if (audio.duration && playlist[idx]) playlist[idx].dur = audio.duration;
};
audio.onloadedmetadata = () => { document.getElementById('dur').textContent = fmt(audio.duration); renderList(); };
document.getElementById('bar').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  if (audio.duration) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
};
document.getElementById('vol').oninput = e => audio.volume = e.target.value;
audio.volume = 0.8;

/* ================= 列表 ================= */
function renderList() {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  document.getElementById('count').textContent = '(' + playlist.length + ')';
  if (!playlist.length) { list.style.display='none'; empty.style.display='block'; return; }
  empty.style.display='none'; list.style.display='block';
  list.innerHTML = '';
  playlist.forEach((t, i) => {
    const li = document.createElement('li');
    if (i === idx) li.className = 'cur';
    li.innerHTML =
      '<span class="idx">' + (i === idx && !audio.paused ? '<span class="playing-eq">▮</span>' : (i+1)) + '</span>' +
      '<span class="info"><div class="nm">' + esc(t.name) + '</div><div class="ar">' + esc(t.artist) + '</div></span>' +
      '<span class="dur">' + (t.dur ? fmt(t.dur) : '--:--') + '</span>' +
      '<button class="del" title="移除">✕</button>';
    li.onclick = () => play(i);
    li.querySelector('.del').onclick = e => { e.stopPropagation(); remove(i); };
    list.appendChild(li);
  });
}
function remove(i) {
  if (playlist[i].url.startsWith('blob:')) URL.revokeObjectURL(playlist[i].url);
  playlist.splice(i, 1);
  if (i < idx) idx--;
  else if (i === idx) { audio.pause(); audio.removeAttribute('src'); idx = playlist.length ? Math.min(i, playlist.length-1) : -1; if (idx>=0) play(idx); }
  if (!playlist.length) { idx = -1; resetNow(); }
  renderList();
}
function clearList() {
  playlist.forEach(t => { if (t.url.startsWith('blob:')) URL.revokeObjectURL(t.url); });
  playlist = []; idx = -1;
  audio.pause(); audio.removeAttribute('src'); resetNow();
  document.getElementById('fill').style.width='0%';
  renderList();
}
function resetNow() {
  document.getElementById('title').textContent='未播放';
  document.getElementById('artist').textContent='先添加 MP3，或从下方曲库点歌';
  document.getElementById('cover').classList.remove('play');
  document.getElementById('playBtn').textContent='▶';
  document.getElementById('cur').textContent='00:00';
  document.getElementById('dur').textContent='00:00';
}

/* ================= 工具 ================= */
function fmt(s) { s = Math.floor(s || 0); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let tm;
function toast(msg) {
  let t = document.getElementById('__t');
  if (!t) {
    t = document.createElement('div'); t.id = '__t';
    t.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#121a33;border:1px solid #223059;color:#eef2ff;padding:9px 20px;border-radius:999px;font-size:.85rem;z-index:99;transition:.25s;opacity:0';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(tm); tm = setTimeout(() => t.style.opacity = 0, 1500);
}
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight' && e.shiftKey) next();
  if (e.code === 'ArrowLeft' && e.shiftKey) prev();
});

renderList();
probeWorld();
</script>
