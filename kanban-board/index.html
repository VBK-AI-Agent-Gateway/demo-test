<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看板 · Kanban Board</title>
<style>
  :root{
    --bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--border:#30363d;
    --fg:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;
    --red:#f85149;--yellow:#d29922;--purple:#bc8cff;
    --col-todo:#8b949e;--col-doing:#58a6ff;--col-done:#3fb950;
    --shadow:0 8px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;min-height:100vh;
  }
  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:16px 20px;border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#161b22,#0d1117);
    position:sticky;top:0;z-index:20;
  }
  h1{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
  h1 .logo{color:var(--accent)}
  .stats{display:flex;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .stats b{color:var(--fg)}
  .spacer{flex:1}
  input[type=search],input[type=text]{
    background:#0d1117;border:1px solid var(--border);color:var(--fg);
    padding:9px 12px;border-radius:8px;font-size:14px;min-width:180px;
  }
  input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  button{
    background:var(--accent);border:0;color:#04121f;font-weight:600;
    padding:9px 15px;border-radius:8px;cursor:pointer;font-size:14px;
  }
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  button.mini{padding:5px 10px;font-size:12px;border-radius:6px}
  button.danger{background:var(--red);color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  main{flex:1;padding:18px;display:flex;gap:16px;align-items:flex-start;overflow-x:auto}
  .column{
    flex:1 1 0;min-width:260px;max-width:420px;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    display:flex;flex-direction:column;max-height:calc(100vh - 140px);
  }
  .col-head{
    display:flex;align-items:center;gap:8px;padding:12px 14px;
    border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);
    border-radius:12px 12px 0 0;
  }
  .dot{width:10px;height:10px;border-radius:50%}
  .col-head h2{margin:0;font-size:15px;font-weight:600}
  .count{
    background:#21262d;border:1px solid var(--border);color:var(--muted);
    font-size:12px;border-radius:999px;padding:1px 8px;
  }
  .col-add{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
  .col-add:hover{color:var(--accent)}
  .cards{padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:80px}
  .card{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:12px;cursor:grab;position:relative;transition:transform .12s,border-color .12s,box-shadow .12s;
  }
  .card:active{cursor:grabbing}
  .card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
  .card.dragging{opacity:.4;transform:rotate(2deg)}
  .card h3{margin:0 0 6px;font-size:14.5px;font-weight:600;word-break:break-word}
  .card p{margin:0 0 8px;font-size:13px;color:var(--muted);word-break:break-word;white-space:pre-wrap}
  .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--border)}
  .tag.p-high{color:var(--red);border-color:var(--red)}
  .tag.p-medium{color:var(--yellow);border-color:var(--yellow)}
  .tag.p-low{color:var(--green);border-color:var(--green)}
  .tag.date{color:var(--purple);border-color:var(--purple)}
  .tag.overdue{color:var(--red);border-color:var(--red);background:rgba(248,81,73,.1)}
  .card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
  .card:hover .card-actions,.card:focus-within .card-actions{opacity:1}
  .icon-btn{background:#21262d;border:1px solid var(--border);color:var(--muted);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1}
  .icon-btn:hover{color:var(--fg);border-color:var(--accent)}
  .icon-btn.del:hover{color:var(--red);border-color:var(--red)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px;border:1px dashed var(--border);border-radius:8px}
  .column.over .cards{background:rgba(88,166,255,.06);border-radius:0 0 12px 12px}
  .column.over{border-color:var(--accent)}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .overlay.open{display:flex}
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:460px;padding:20px;box-shadow:var(--shadow);
  }
  .modal h2{margin:0 0 14px;font-size:17px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea,.field select{
    width:100%;background:#0d1117;border:1px solid var(--border);color:var(--fg);
    padding:9px 11px;border-radius:8px;font-size:14px;font-family:inherit;
  }
  .field textarea{min-height:76px;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{outline:1px solid var(--accent)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .toast-wrap{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
  .toast{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:13.5px;box-shadow:var(--shadow);max-width:320px}
  .toast.ok{border-left-color:var(--green)}
  .toast.warn{border-left-color:var(--yellow)}
  footer{color:var(--muted);text-align:center;padding:12px;font-size:12.5px;border-top:1px solid var(--border)}
  .hint{font-size:12px;color:var(--muted)}
  /* responsive: 3 breakpoints */
  @media (max-width: 900px){
    main{gap:12px}
    .column{min-width:240px}
    header{padding:12px 14px}
    h1{font-size:18px}
  }
  @media (max-width: 640px){
    main{flex-direction:column;overflow-x:hidden;padding:12px}
    .column{max-width:100%;width:100%;min-width:0;max-height:none}
    .cards{max-height:none}
    header{gap:8px}
    input[type=search]{min-width:120px;flex:1}
    .stats{order:3;width:100%}
  }
  @media (max-width: 420px){
    header{padding:10px 10px}
    h1{font-size:16px}
    .stats{font-size:12px;gap:6px}
    .card-actions{opacity:1}
  }
</style>
</head>
<body>
<header>
  <h1><span class="logo">◈</span> 看板 Kanban</h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <input type="search" id="search" placeholder="搜索任务… (标题/描述)" aria-label="搜索任务">
  <select id="filterPriority" aria-label="按优先级过滤">
    <option value="">全部优先级</option>
    <option value="high">高</option>
    <option value="medium">中</option>
    <option value="low">低</option>
  </select>
  <button id="btnNew">＋ 新任务</button>
  <button id="btnReset" class="ghost" title="恢复示例数据">↺ 重置</button>
</header>

<main id="board" aria-label="看板"></main>

<footer>看板 · 拖拽卡片换列 · 数据保存在浏览器 localStorage · 响应式三档断点</footer>

<!-- edit/create modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">新任务</h2>
    <div class="field">
      <label for="fTitle">标题 *</label>
      <input id="fTitle" maxlength="120" placeholder="要做的一件事">
    </div>
    <div class="field">
      <label for="fDesc">描述</label>
      <textarea id="fDesc" maxlength="1000" placeholder="可选：细节、验收标准…"></textarea>
    </div>
    <div class="field">
      <label for="fPriority">优先级</label>
      <select id="fPriority">
        <option value="high">高</option>
        <option value="medium" selected>中</option>
        <option value="low">低</option>
      </select>
    </div>
    <div class="field">
      <label for="fDue">截止日期</label>
      <input id="fDue" type="date">
    </div>
    <div class="field">
      <label for="fCol">所在列</label>
      <select id="fCol">
        <option value="todo">待办</option>
        <option value="doing">进行中</option>
        <option value="done">已完成</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="ghost" id="btnCancel">取消</button>
      <button id="btnSave">保存</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
"use strict";
/* ============================ 数据层 ============================ */
const STORAGE_KEY = "kanban-board-v1";
const COLUMNS = [
  { id: "todo",  title: "待办",    color: "var(--col-todo)" },
  { id: "doing", title: "进行中",  color: "var(--col-doing)" },
  { id: "done",  title: "已完成",  color: "var(--col-done)" },
];
const PRIO_LABEL = { high: "高", medium: "中", low: "低" };

let state = load();
let query = "";
let filterPriority = "";
let editingId = null;      // null => creating

function uid() {
  return "c-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
}

function seedData() {
  const now = Date.now();
  const day = 86400000;
  return [
    { id: uid(), col: "todo",  title: "整理需求清单",   desc: "把用户故事拆成卡片",       priority: "high",   due: fmtDate(now + day),  created: now },
    { id: uid(), col: "todo",  title: "画线框图",       desc: "三档断点各一版",           priority: "medium", due: fmtDate(now + 2*day), created: now },
    { id: uid(), col: "todo",  title: "准备周会材料",   desc: "",                        priority: "low",    due: "",                  created: now },
    { id: uid(), col: "doing", title: "实现拖拽交互",   desc: "鼠标 + 触摸双端兜底",       priority: "high",   due: fmtDate(now),        created: now },
    { id: uid(), col: "doing", title: "接入本地存储",   desc: "刷新不丢数据",             priority: "medium", due: "",                  created: now },
    { id: uid(), col: "done",  title: "初始化项目",     desc: "单文件 HTML 零依赖",        priority: "medium", due: "",                  created: now },
    { id: uid(), col: "done",  title: "搭好三列布局",   desc: "",                        priority: "low",    due: "",                  created: now },
  ];
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return seedData();
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : seedData();
  } catch (e) {
    return seedData();
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    toast("保存失败：本地存储不可用", "warn");
  }
}

function fmtDate(ts) {
  const d = new Date(ts);
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}

function isOverdue(due, col) {
  if (!due || col === "done") return false;
  const today = fmtDate(Date.now());
  return due < today;
}

/* ============================ 渲染 ============================ */
const boardEl = document.getElementById("board");
const statsEl = document.getElementById("stats");

function matches(t) {
  if (filterPriority && t.priority !== filterPriority) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  return (
    (t.title || "").toLowerCase().includes(q) ||
    (t.desc || "").toLowerCase().includes(q)
  );
}

function render() {
  boardEl.innerHTML = "";
  COLUMNS.forEach((col) => {
    const all = state.filter((t) => t.col === col.id);
    const visible = all.filter(matches);

    const section = document.createElement("section");
    section.className = "column";
    section.dataset.col = col.id;
    section.innerHTML = `
      <div class="col-head">
        <span class="dot" style="background:${col.color}"></span>
        <h2>${col.title}</h2>
        <span class="count">${visible.length}${visible.length !== all.length ? " / " + all.length : ""}</span>
        <button class="col-add" title="在此列新建任务" aria-label="在${col.title}列新建任务">＋</button>
      </div>
      <div class="cards" data-col="${col.id}"></div>
    `;
    const cardsEl = section.querySelector(".cards");

    if (visible.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = query || filterPriority ? "没有匹配的任务" : "拖拽卡片到这里，或点 ＋ 新建";
      cardsEl.appendChild(empty);
    } else {
      visible.forEach((t) => cardsEl.appendChild(renderCard(t)));
    }

    section.querySelector(".col-add").addEventListener("click", () => openModal(null, col.id));

    // drop target: whole column
    attachDrop(section, col.id);
    boardEl.appendChild(section);
  });
  renderStats();
}

function renderCard(t) {
  const el = document.createElement("article");
  el.className = "card";
  el.draggable = true;
  el.dataset.id = t.id;
  el.tabIndex = 0;

  const overdue = isOverdue(t.due, t.col);
  const dueTag = t.due
    ? `<span class="tag date${overdue ? " overdue" : ""}">${overdue ? "⚠ 已逾期 " : "📅 "}${t.due}</span>`
    : "";

  el.innerHTML = `
    <div class="card-actions">
      <button class="icon-btn edit" title="编辑" aria-label="编辑任务">✎</button>
      <button class="icon-btn del" title="删除" aria-label="删除任务">✕</button>
    </div>
    <h3></h3>
    <p></p>
    <div class="tags">
      <span class="tag p-${t.priority}">${PRIO_LABEL[t.priority] || t.priority}</span>
      ${dueTag}
      <span class="tag" title="版本">v${t.version || 1}</span>
    </div>
  `;
  el.querySelector("h3").textContent = t.title || "（无标题）";
  el.querySelector("p").textContent = t.desc || "";
  if (!t.desc) el.querySelector("p").style.display = "none";

  el.querySelector(".edit").addEventListener("click", (e) => { e.stopPropagation(); openModal(t.id); });
  el.querySelector(".del").addEventListener("click", (e) => { e.stopPropagation(); removeCard(t.id); });

  // click card (not buttons) -> edit
  el.addEventListener("click", () => openModal(t.id));
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter") openModal(t.id);
  });

  // HTML5 drag
  el.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/plain", t.id);
    e.dataTransfer.effectAllowed = "move";
    el.classList.add("dragging");
    dragId = t.id;
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
    dragId = null;
    document.querySelectorAll(".column.over").forEach((c) => c.classList.remove("over"));
  });

  // touch fallback (mobile): long-press to pick, tap column to drop
  attachTouchDrag(el, t.id);

  return el;
}

function renderStats() {
  const total = state.length;
  const done = state.filter((t) => t.col === "done").length;
  const doing = state.filter((t) => t.col === "doing").length;
  const overdue = state.filter((t) => isOverdue(t.due, t.col)).length;
  statsEl.innerHTML =
    `<span>共 <b>${total}</b></span>` +
    `<span>进行中 <b>${doing}</b></span>` +
    `<span>完成 <b>${done}</b></span>` +
    `<span>逾期 <b style="color:var(--red)">${overdue}</b></span>`;
}

/* ============================ 拖拽 ============================ */
let dragId = null;
let touchId = null;

function attachDrop(section, colId) {
  section.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    section.classList.add("over");
  });
  section.addEventListener("dragleave", (e) => {
    if (!section.contains(e.relatedTarget)) section.classList.remove("over");
  });
  section.addEventListener("drop", (e) => {
    e.preventDefault();
    section.classList.remove("over");
    const id = e.dataTransfer.getData("text/plain") || dragId;
    if (id) moveCard(id, colId);
  });

  // touch: tap a column while holding a card
  section.addEventListener("click", () => {
    if (touchId) {
      moveCard(touchId, colId);
      touchId = null;
      toast("已移动到「" + (COLUMNS.find((c) => c.id === colId) || {}).title + "」", "ok");
    }
  });
}

function attachTouchDrag(cardEl, id) {
  let timer = null;
  let started = false;

  const start = (e) => {
    started = false;
    timer = setTimeout(() => {
      started = true;
      touchId = id;
      cardEl.classList.add("dragging");
      if (navigator.vibrate) navigator.vibrate(30);
      toast("拖到目标列后点击该列即可移动", "warn");
    }, 350); // long-press
  };
  const cancel = () => {
    clearTimeout(timer);
    if (started) {
      cardEl.classList.remove("dragging");
      // if released without a column tap, keep holding (touchId stays until column tap or next card)
    }
    started = false;
  };

  cardEl.addEventListener("touchstart", start, { passive: true });
  cardEl.addEventListener("touchend", cancel);
  cardEl.addEventListener("touchmove", () => clearTimeout(timer), { passive: true });
}

function moveCard(id, colId) {
  const t = state.find((x) => x.id === id);
  if (!t || t.col === colId) { render(); return; }
  t.col = colId;
  t.version = (t.version || 1) + 1;
  t.updated = Date.now();
  save();
  render();
}

function removeCard(id) {
  const t = state.find((x) => x.id === id);
  if (!t) return;
  if (!confirm("删除「" + t.title + "」？")) return;
  state = state.filter((x) => x.id !== id);
  save();
  render();
  toast("已删除", "ok");
}

/* ============================ 弹窗（新建/编辑） ============================ */
const overlay = document.getElementById("overlay");
const fTitle = document.getElementById("fTitle");
const fDesc = document.getElementById("fDesc");
const fPriority = document.getElementById("fPriority");
const fDue = document.getElementById("fDue");
const fCol = document.getElementById("fCol");
const modalTitle = document.getElementById("modalTitle");

function openModal(id, presetCol) {
  editingId = id || null;
  const t = id ? state.find((x) => x.id === id) : null;
  modalTitle.textContent = t ? "编辑任务" : "新任务";
  fTitle.value = t ? t.title : "";
  fDesc.value = t ? t.desc : "";
  fPriority.value = t ? t.priority : "medium";
  fDue.value = t ? t.due : "";
  fCol.value = t ? t.col : (presetCol || "todo");
  overlay.classList.add("open");
  setTimeout(() => fTitle.focus(), 50);
}

function closeModal() {
  overlay.classList.remove("open");
  editingId = null;
}

function saveModal() {
  const title = fTitle.value.trim();
  if (!title) { toast("标题不能为空", "warn"); fTitle.focus(); return; }

  const payload = {
    title,
    desc: fDesc.value.trim(),
    priority: fPriority.value,
    due: fDue.value,
    col: fCol.value,
  };

  if (editingId) {
    const t = state.find((x) => x.id === editingId);
    if (t) {
      Object.assign(t, payload);
      t.version = (t.version || 1) + 1;
      t.updated = Date.now();
    }
    toast("已保存", "ok");
  } else {
    state.unshift({
      id: uid(),
      created: Date.now(),
      version: 1,
      ...payload,
    });
    toast("已创建", "ok");
  }
  save();
  closeModal();
  render();
}

document.getElementById("btnSave").addEventListener("click", saveModal);
document.getElementById("btnCancel").addEventListener("click", closeModal);
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && overlay.classList.contains("open")) closeModal();
  if (e.key === "Enter" && overlay.classList.contains("open") && document.activeElement !== fDesc) {
    saveModal();
  }
});

/* ============================ 工具栏 ============================ */
document.getElementById("btnNew").addEventListener("click", () => openModal(null, "todo"));
document.getElementById("search").addEventListener("input", (e) => {
  query = e.target.value.trim();
  render();
});
document.getElementById("filterPriority").addEventListener("change", (e) => {
  filterPriority = e.target.value;
  render();
});
document.getElementById("btnReset").addEventListener("click", () => {
  if (!confirm("重置为示例数据？当前数据将丢失。")) return;
  state = seedData();
  save();
  render();
  toast("已重置为示例数据", "ok");
});

/* ============================ toast ============================ */
function toast(msg, kind) {
  const wrap = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ============================ 启动 ============================ */
save(); // persist seed on first run
render();
</script>
</body>
</html>
