<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 · 蟒蛇出击</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(150deg,#0b3d2e 0%,#14532d 50%,#052e16 100%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;
}
.wrap{width:min(440px,100vw);height:min(760px,100vh);display:flex;flex-direction:column;padding:16px;position:relative;}
h1{font-size:26px;text-align:center;color:#a7f3d0;font-weight:900;letter-spacing:4px;text-shadow:0 4px 14px rgba(0,0,0,.5);}
.sub{text-align:center;color:#6ee7b7;font-size:13px;margin-top:4px;font-weight:700;letter-spacing:2px;}
.top{display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px;gap:8px;}
.scores{display:flex;gap:8px;}
.sbox{background:rgba(0,0,0,.35);border-radius:14px;padding:8px 14px;text-align:center;min-width:80px;border:1px solid rgba(167,243,208,.25);}
.sbox .t{font-size:11px;color:#a7f3d0;font-weight:800;letter-spacing:2px;}
.sbox .v{font-size:22px;color:#ffd166;font-weight:900;}
.btns{display:flex;gap:8px;}
.btn{background:linear-gradient(145deg,#ffd166,#f08c00);color:#3d2500;border:none;border-radius:14px;padding:10px 16px;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 4px 0 #a35a00;transition:.1s;}
.btn:active{transform:translateY(3px);box-shadow:none;}
.btn.p{background:linear-gradient(145deg,#34d399,#059669);color:#fff;box-shadow:0 4px 0 #065f46;}
.board-frame{position:relative;background:rgba(0,0,0,.4);border-radius:20px;padding:12px;border:2px solid rgba(167,243,208,.3);
  box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);}
#cv{display:block;width:100%;aspect-ratio:1;background:
  repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,255,255,.03) 23px 24px),
  repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,.03) 23px 24px),
  #0a1f16;border-radius:12px;}
.hud{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;}
.tip{background:rgba(255,255,255,.08);border:1px solid rgba(167,243,208,.2);border-radius:14px;padding:8px 14px;font-size:13px;font-weight:700;color:#d1fae5;flex:1;}
.tip b{color:#ffd166;}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:8px;justify-content:center;margin-top:14px;}
.dbtn{background:linear-gradient(145deg,#34d399,#059669);color:#fff;border:none;border-radius:16px;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #065f46;transition:.08s;}
.dbtn:active{transform:translateY(4px);box-shadow:none;}
.dbtn.empty{background:none;box-shadow:none;cursor:default;}
.overlay{position:absolute;inset:0;background:rgba(5,20,12,.94);backdrop-filter:blur(5px);border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:6;}
.overlay.hide{display:none;}
.overlay .big{font-size:64px;}
.overlay h2{font-size:32px;background:linear-gradient(90deg,#ffd166,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;}
.overlay p{font-size:15px;color:#a7f3d0;line-height:1.8;}
.bigbtn{padding:14px 44px;border:none;border-radius:30px;font-size:18px;font-weight:900;cursor:pointer;
  background:linear-gradient(145deg,#ffd166,#f08c00);color:#3d2500;box-shadow:0 6px 0 #a35a00;}
.bigbtn:active{transform:translateY(4px);box-shadow:none;}
.bigbtn.p{background:linear-gradient(145deg,#34d399,#059669);color:#fff;box-shadow:0 6px 0 #065f46;}
#toast{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:#fff;
  padding:12px 26px;border-radius:30px;font-weight:900;font-size:18px;opacity:0;transition:.25s;pointer-events:none;
  z-index:9;border:2px solid #34d399;}
#toast.show{opacity:1;transform:translate(-50%,-62%);}
.speed-tag{position:absolute;top:16px;right:22px;background:rgba(255,90,90,.9);color:#fff;font-weight:900;font-size:12px;
  padding:3px 12px;border-radius:12px;z-index:7;letter-spacing:1px;}
.speed-tag.hide{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 贪吃蛇</h1>
  <div class="sub">蟒蛇出击 · 吃光食物</div>
  <div class="top">
    <div class="scores">
      <div class="sbox"><div class="t">分数</div><div class="v" id="score">0</div></div>
      <div class="sbox"><div class="t">最佳</div><div class="v" id="best">0</div></div>
    </div>
    <div class="btns">
      <button class="btn" onclick="openHelp()">❓ 玩法</button>
      <button class="btn p" onclick="startGame()">🔄 新局</button>
    </div>
  </div>
  <div class="board-frame">
    <canvas id="cv"></canvas>
    <div class="speed-tag hide" id="speedTag">🔥 加速中</div>
    <div class="overlay" id="startOv">
      <div class="big">🐍</div>
      <h2>贪吃蛇</h2>
      <p>方向键 / WASD / 滑动 / 虚拟按钮 控制方向<br>吃食物长大，别撞墙也别咬到自己！<br>每 5 分提速一档 🚀</p>
      <button class="bigbtn" onclick="startGame()">开始游戏</button>
    </div>
    <div class="overlay hide" id="overOv">
      <div class="big">💀</div>
      <h2>游戏结束</h2>
      <p>最终得分：<b id="finalScore">0</b><br>历史最佳：<b id="finalBest">0</b></p>
      <div style="display:flex;gap:12px;">
        <button class="bigbtn" onclick="startGame()">再来一局</button>
        <button class="bigbtn p" onclick="openHelp()">📖 玩法</button>
      </div>
    </div>
    <div class="overlay hide" id="helpOv">
      <div class="big">📖</div>
      <h2>玩法说明</h2>
      <p>① 方向键 / WASD / 屏幕滑动 / 虚拟按钮 控制<br>② 吃到 🍎 得 1 分，蛇身增长 1 节<br>③ 每 5 分速度提升一档（上限 8 档）<br>④ 撞墙或咬到自己 = 游戏结束<br>⑤ 短时间连续吃 3 个 → 连吃奖励 ⭐</p>
      <button class="bigbtn p" onclick="closeHelp()">明白啦</button>
    </div>
    <div id="toast"></div>
  </div>
  <div class="hud">
    <div class="tip">🎯 速度档 <b id="speed">1</b>/8 · 长度 <b id="len">3</b></div>
  </div>
  <div class="dpad">
    <div class="dbtn empty"></div>
    <button class="dbtn" onclick="setDir(0,-1)">⬆</button>
    <div class="dbtn empty"></div>
    <button class="dbtn" onclick="setDir(-1,0)">⬅</button>
    <div class="dbtn empty"></div>
    <button class="dbtn" onclick="setDir(1,0)">➡</button>
    <div class="dbtn empty"></div>
    <button class="dbtn" onclick="setDir(0,1)">⬇</button>
    <div class="dbtn empty"></div>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const N = 20;               // 20x20 网格
let cell, gridPx;
let snake, dir, nextDir, food, score, best, over, started, speed, tickMs, timer, eatStreak, streakT;

function resizeCanvas(){
  const rect = cv.getBoundingClientRect();
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = rect.width * DPR;
  cv.height = rect.width * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cell = rect.width / N;
  gridPx = rect.width;
  draw();
}
window.addEventListener('resize', resizeCanvas);

best = +(localStorage.getItem('snakeBest') || 0);
document.getElementById('best').textContent = best;

function startGame(){
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; over = false; started = true;
  speed = 1; tickMs = 150;
  eatStreak = 0; streakT = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('speed').textContent = 1;
  document.getElementById('len').textContent = 3;
  document.getElementById('startOv').classList.add('hide');
  document.getElementById('overOv').classList.add('hide');
  document.getElementById('helpOv').classList.add('hide');
  document.getElementById('speedTag').classList.add('hide');
  spawnFood();
  if(timer) clearInterval(timer);
  timer = setInterval(tick, tickMs);
  draw();
}

function spawnFood(){
  const occupied = new Set(snake.map(s => s.x + ',' + s.y));
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)};
  } while(occupied.has(pos.x + ',' + pos.y));
  food = pos;
}

function setDir(x, y){
  if(!started || over) return;
  // 禁止 180 度掉头
  if(dir.x === -x && dir.y === -y) return;
  nextDir = {x, y};
}

function tick(){
  if(over || !started) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙
  if(head.x < 0 || head.x >= N || head.y < 0 || head.y >= N){ die('撞墙了 🧱'); return; }
  // 咬到自己（不含尾巴，因为尾巴下一步会移走，除非吃到食物）
  const willEat = (head.x === food.x && head.y === food.y);
  const body = willEat ? snake : snake.slice(0, -1);
  if(body.some(s => s.x === head.x && s.y === head.y)){ die('咬到自己了 🤕'); return; }

  snake.unshift(head);
  if(willEat){
    // 连吃奖励
    const now = Date.now();
    if(now - streakT < 3000) eatStreak++; else eatStreak = 1;
    streakT = now;
    let pts = 1;
    if(eatStreak >= 3){ pts = 2; toast('⭐ 连吃奖励 +2！'); }
    score += pts;
    document.getElementById('score').textContent = score;
    if(score > best){ best = score; localStorage.setItem('snakeBest', best); document.getElementById('best').textContent = best; }
    spawnFood();
    // 提速
    const newSpeed = Math.min(8, 1 + Math.floor(score / 5));
    if(newSpeed !== speed){
      speed = newSpeed;
      tickMs = Math.max(60, 150 - (speed - 1) * 12);
      clearInterval(timer);
      timer = setInterval(tick, tickMs);
      document.getElementById('speed').textContent = speed;
      document.getElementById('speedTag').classList.remove('hide');
      toast('🚀 提速至 ' + speed + ' 档！');
      setTimeout(() => document.getElementById('speedTag').classList.add('hide'), 1600);
    }
  } else {
    snake.pop();
  }
  document.getElementById('len').textContent = snake.length;
  draw();
}

function die(msg){
  over = true; started = false;
  clearInterval(timer);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = best;
  toast(msg);
  draw();
  setTimeout(() => document.getElementById('overOv').classList.remove('hide'), 600);
}

function draw(){
  if(!snake) return;
  ctx.clearRect(0, 0, gridPx, gridPx);
  // food
  const fx = food.x * cell, fy = food.y * cell;
  ctx.fillStyle = '#ff5b5b';
  ctx.beginPath();
  ctx.arc(fx + cell/2, fy + cell/2, cell*0.36, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(fx + cell*0.34, fy + cell*0.3, cell*0.1, 0, Math.PI*2);
  ctx.fill();
  // leaf
  ctx.fillStyle = '#34d399';
  ctx.beginPath();
  ctx.ellipse(fx + cell*0.6, fy + cell*0.16, cell*0.14, cell*0.08, -0.6, 0, Math.PI*2);
  ctx.fill();

  // snake
  snake.forEach((s, i) => {
    const t = i / snake.length;
    const x = s.x * cell, y = s.y * cell;
    const pad = cell * 0.08;
    ctx.fillStyle = i === 0 ? '#a7f3d0' : 'hsl(' + (150 - t*40) + ',70%,' + (46 - t*16) + '%)';
    roundRect(x + pad, y + pad, cell - pad*2, cell - pad*2, cell*0.25);
    if(i === 0){
      // eyes
      ctx.fillStyle = '#052e16';
      const ec = cell * 0.14;
      const cx = x + cell/2 + dir.x * cell * 0.2;
      const cy = y + cell/2 + dir.y * cell * 0.2;
      const ex = Math.abs(dir.x) > 0 ? 0 : cell * 0.2;
      const ey = Math.abs(dir.y) > 0 ? 0 : cell * 0.2;
      ctx.beginPath(); ctx.arc(cx - ex, cy - ey, ec, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + ex, cy + ey, ec, 0, Math.PI*2); ctx.fill();
    }
  });
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.fill();
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

function openHelp(){ document.getElementById('helpOv').classList.remove('hide'); }
function closeHelp(){ document.getElementById('helpOv').classList.add('hide'); }

// keyboard
window.addEventListener('keydown', e => {
  const map = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
    W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]
  };
  if(e.key in map){
    e.preventDefault();
    setDir(map[e.key][0], map[e.key][1]);
  }
});

// swipe
let tx=0, ty=0;
const frame = document.querySelector('.board-frame');
frame.addEventListener('pointerdown', e => { tx = e.clientX; ty = e.clientY; });
frame.addEventListener('pointerup', e => {
  const dx = e.clientX - tx, dy = e.clientY - ty;
  if(Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if(Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
});

resizeCanvas();
</script>
</body>
</html>
