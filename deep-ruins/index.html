<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深空遗迹 · 探险解谜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh; color:#dce9ff;
    background:radial-gradient(1000px 600px at 70% -10%, #10233f 0%, #05070f 60%);
    display:flex; flex-direction:column; align-items:center; padding:24px 14px 40px;
  }
  h1 { font-size:1.4rem; letter-spacing:4px; margin-bottom:4px; }
  h1 span { color:#7dd3fc; }
  .sub { color:#7f93b8; font-size:.84rem; margin-bottom:16px; text-align:center; text-align:center; }
  .hud {
    display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:14px;
    background:rgba(13,22,44,.8); border:1px solid #23395e; border-radius:14px; padding:10px 18px; font-size:.86rem;
  }
  .hud b { color:#7dd3fc; }
  #wrap {
    position:relative; border:1px solid #23395e; border-radius:16px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.55); background:#04060d;
  }
  canvas { display:block; }
  .pad {
    display:none; position:absolute; inset:0; pointer-events:none;
  }
  .pad .btn {
    position:absolute; width:58px; height:58px; border-radius:50%;
    background:rgba(125,211,252,.14); border:1px solid rgba(125,211,252,.5);
    color:#dff3ff; font-size:1.3rem; display:flex; align-items:center; justify-content:center;
    pointer-events:auto; user-select:none; -webkit-user-select:none;
  }
  .pad .up{left:74px;bottom:150px;} .pad .down{left:74px;bottom:34px;}
  .pad .left{left:14px;bottom:92px;} .pad .right{left:134px;bottom:92px;}
  .pad .act{right:22px;bottom:92px;background:rgba(250,204,21,.14);border-color:rgba(250,204,21,.6);}
  @media (pointer:coarse){ .pad{display:block;} }
  .overlay {
    position:absolute; inset:0; background:rgba(4,7,15,.88);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:12px; padding:24px; backdrop-filter:blur(4px);
  }
  .overlay h2 { font-size:1.5rem; letter-spacing:2px; }
  .overlay p { color:#9db2d8; font-size:.9rem; line-height:1.9; max-width:440px; }
  .overlay button {
    background:linear-gradient(135deg,#0ea5e9,#22d3ee); color:#04121f; border:none;
    border-radius:999px; padding:12px 34px; font-size:1rem; font-weight:700; cursor:pointer;
    letter-spacing:2px; box-shadow:0 8px 24px rgba(34,211,238,.35);
  }
  .overlay button:hover { filter:brightness(1.1); }
  .keys { color:#6b81aa; font-size:.78rem; margin-top:12px; }
  .toast {
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
    background:#0d1a33; border:1px solid #2b4a7a; color:#dff3ff;
    padding:10px 22px; border-radius:999px; font-size:.86rem; opacity:0;
    transition:.25s; pointer-events:none; z-index:9;
  }
</style>
</head>
<body>

<h1>🛸 深空<span>遗迹</span></h1>
<div class="sub">收集散落的能量晶核，避开巡逻守卫，激活传送门进入下一层遗迹</div>

<div class="hud">
  <span>⏱ 时间 <b id="hTime">0</b> s</span>
  <span>💎 晶核 <b id="hGems">0/0</b></span>
  <span>❤️ 生命 <b id="hHp">3</b></span>
  <span>🚪 层数 <b id="hFloor">1</b></span>
  <span>🏆 得分 <b id="hScore">0</b></span>
</div>

<div id="wrap">
  <canvas id="cv" width="720" height="480"></canvas>
  <div class="pad">
    <div class="btn up" data-k="up">▲</div>
    <div class="btn down" data-k="down">▼</div>
    <div class="btn left" data-k="left">◀</div>
    <div class="btn right" data-k="right">▶</div>
    <div class="btn act" data-k="act">⚡</div>
  </div>
  <div class="overlay" id="ov">
    <h2 id="ovTitle">深空遗迹</h2>
    <p id="ovDesc">你在远古外星遗迹中苏醒。每一层散布着若干<b style="color:#7dd3fc">能量晶核</b>，
      收集全部后出口传送门会亮起；小心<b style="color:#f87171">红色巡逻守卫</b>与<b style="color:#fbbf24">带电尖刺</b>，
      被击中会损失生命并短暂无敌。按 <b>⚡</b> 可释放震退波击退附近守卫（有冷却）。</p>
    <button id="ovBtn">开 始 探 险</button>
    <div class="keys">🎮 移动：WASD / 方向键 · 技能：空格 · 触屏用虚拟按键</div>
  </div>
</div>

<div class="keys" style="margin-top:14px;color:#546a91">提示：每层遗迹与守卫布局随机生成；连过 3 层通关，撞墙/守卫/尖刺都会扣血。</div>
<div class="toast" id="toast"></div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, TS = 40; // tile 40px -> 18x12
const COLS = W / TS, ROWS = H / TS;

let state = 'menu'; // menu | play | dead | win
let floor = 1, score = 0, hp = 3, gemsGot = 0, gemsAll = 0, elapsed = 0;
let grid, player, guards, gate, last = 0, inv = 0, pulseCd = 0, shake = 0;
const keys = {};
let gems = [], spikes = [];

function rnd(n) { return Math.floor(Math.random() * n); }

/* ---------- 关卡生成：随机房间+走廊迷宫 ---------- */
function genLevel() {
  // 0=墙 1=地
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  // 随机房间
  const rooms = [];
  const rc = 5 + rnd(3);
  for (let i = 0; i < rc; i++) {
    const w = 3 + rnd(5), h = 3 + rnd(3);
    const x = 1 + rnd(COLS - w - 2), y = 1 + rnd(ROWS - h - 2);
    rooms.push({x,y,w,h});
    for (let yy = y; yy < y+h; yy++) for (let xx = x; xx < x+w; xx++) grid[yy][xx] = 1;
  }
  // 走廊连接房间中心
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i-1], b = rooms[i];
    let ax = Math.floor(a.x + a.w/2), ay = Math.floor(a.y + a.h/2);
    let bx = Math.floor(b.x + b.w/2), by = Math.floor(b.y + b.h/2);
    while (ax !== bx) { grid[ay][ax] = 1; ax += ax < bx ? 1 : -1; }
    while (ay !== by) { grid[ay][ax] = 1; ay += ay < by ? 1 : -1; }
  }
  // 确保至少一个大房间（出生点）
  const s = rooms[0];
  const px = Math.floor(s.x + s.w/2), py = Math.floor(s.y + s.h/2);
  player = { x: px*TS, y: py*TS, w: 28, h: 28, vx: 0, vy: 0, dir: 0, anim: 0 };

  // 可走格
  const walk = [];
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) if (grid[y][x]) walk.push({x,y});
  const far = (cx,cy) => walk.map(c=>({...c, d: Math.abs(c.x-cx)+Math.abs(c.y-cy)})).sort((a,b)=>b.d-a.d);
  const dist = far(px,py);

  // 出口门：最远的可走格
  const g = dist[0];
  gate = { x: g.x*TS, y: g.y*TS, open:false };

  // 晶核：较远且分散
  gems = []; const need = 4 + floor;
  const cand = dist.slice(Math.floor(dist.length*0.25));
  while (gems.length < need && cand.length) {
    const c = cand.splice(rnd(cand.length),1)[0];
    if (Math.abs(c.x-g.x)+Math.abs(c.y-g.y) < 2) continue;
    if (gems.some(e=>Math.abs(e.x-c.x)+Math.abs(e.y-c.y)<3)) continue;
    gems.push({x:c.x*TS+6, y:c.y*TS+6, t:Math.random()*6});
  }
  gemsAll = gems.length; gemsGot = 0;

  // 尖刺：静态陷阱
  spikes = [];
  const sc = 3 + rnd(3) + floor;
  const cand2 = dist.slice(Math.floor(dist.length*0.35));
  while (spikes.length < sc && cand2.length) {
    const c = cand2.splice(rnd(cand2.length),1)[0];
    if (Math.abs(c.x-px)+Math.abs(c.y-py) < 5) continue;
    if (gems.some(e=>Math.abs(e.x-c.x*TS)<TS && Math.abs(e.y-c.y*TS)<TS)) continue;
    spikes.push({x:c.x*TS+8, y:c.y*TS+8, t:Math.random()*3});
  }

  // 守卫：中距离巡逻（简单游走 AI + 追击视野）
  guards = [];
  const gc = 2 + floor;
  const cand3 = dist.slice(Math.floor(dist.length*0.5));
  while (guards.length < gc && cand3.length) {
    const c = cand3.splice(rnd(cand3.length),1)[0];
    if (Math.abs(c.x-px)+Math.abs(c.y-py) < 6) continue;
    guards.push({
      x:c.x*TS+6, y:c.y*TS+6, w:26, h:26,
      dx:[1,0,-1,0][rnd(4)], dy:[0,1,0,-1][rnd(4)],
      spd: 1.1 + Math.random()*0.7 + floor*0.12,
      st: 0, stT: 0, stun: 0
    });
  }
}

/* ---------- 碰撞 ---------- */
function solid(x, y, w, h) {
  const x0=Math.floor(x/TS), x1=Math.floor((x+w-1)/TS), y0=Math.floor(y/TS), y1=Math.floor((y+h-1)/TS);
  for (let yy=y0; yy<=y1; yy++) for (let xx=x0; xx<=x1; xx++)
    if (yy<0||xx<0||yy>=ROWS||xx>=COLS||!grid[yy][xx]) return true;
  return false;
}
function overlap(a,b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function center(o) { return {x:o.x+o.w/2, y:o.y+o.h/2}; }

/* ---------- 输入 ---------- */
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Space' && state === 'play') pulse();
});
addEventListener('keyup', e => keys[e.code] = false);
document.querySelectorAll('.pad .btn').forEach(b => {
  const map = {up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); if (k === 'act') pulse(); else keys[map[k]] = true; };
  const off = e => { e.preventDefault(); if (map[k]) keys[map[k]] = false; };
  b.addEventListener('touchstart', on); b.addEventListener('touchend', off);
  b.addEventListener('mousedown', on); b.addEventListener('mouseup', off);
});

/* ---------- 技能：震退波 ---------- */
function pulse() {
  if (pulseCd > 0) return;
  pulseCd = 5;
  const pc = center(player);
  shake = 6;
  guards.forEach(g => {
    const d = Math.hypot(g.x-pc.x, g.y-pc.y);
    if (d < 130) {
      const a = Math.atan2(g.y-pc.y, g.x-pc.x);
      const nx = g.x + Math.cos(a)*70, ny = g.y + Math.sin(a)*70;
      if (!solid(nx, g.y, g.w, g.h)) g.x = nx;
      if (!solid(g.x, ny, g.w, g.h)) g.y = ny;
      g.stun = 2.2;
    }
  });
  toast('⚡ 震退波！');
}

function damage(msg) {
  if (inv > 0) return;
  hp--; inv = 2;
  shake = 10;
  if (hp <= 0) { state = 'dead'; showOv('任务失败', '生命耗尽，遗迹吞噬了你……本次得分 <b style="color:#7dd3fc">' + score + '</b>，抵达第 <b style="color:#7dd3fc">' + floor + '</b> 层。', '再 来 一 次'); }
  else toast(msg);
  updateHud();
}

/* ---------- 更新 ---------- */
function update(dt) {
  elapsed += dt;
  if (inv > 0) inv -= dt;
  if (pulseCd > 0) pulseCd -= dt;
  if (shake > 0) shake -= dt * 20;

  const sp = 3.2;
  let mx = 0, my = 0;
  if (keys['ArrowLeft']||keys['KeyA']) mx -= 1;
  if (keys['ArrowRight']||keys['KeyD']) mx += 1;
  if (keys['ArrowUp']||keys['KeyW']) my -= 1;
  if (keys['ArrowDown']||keys['KeyS']) my += 1;
  if (mx && my) { mx *= 0.707; my *= 0.707; }
  if (mx || my) { player.anim += dt * 8; player.dir = Math.atan2(my, mx); }

  const nx = player.x + mx*sp;
  if (!solid(nx, player.y, player.w, player.h)) player.x = nx;
  const ny = player.y + my*sp;
  if (!solid(player.x, ny, player.w, player.h)) player.y = ny;

  // 晶核
  const pc = center(player);
  gems = gems.filter(g => {
    g.t += dt;
    if (Math.hypot(g.x+6-pc.x, g.y+6-pc.y) < 22) {
      score += 100; gemsGot++;
      if (gemsGot >= gemsAll && !gate.open) { gate.open = true; toast('🚪 传送门已激活！'); }
      updateHud();
      return false;
    }
    return true;
  });

  // 尖刺
  spikes.forEach(s => { s.t += dt; });
  for (const s of spikes) {
    const cycle = (s.t % 3);
    if (cycle > 1.6) { // 伸出状态
      const box = {x:s.x, y:s.y, w:24, h:24};
      if (overlap(player, box)) { damage('💥 踩到带电尖刺！'); break; }
    }
  }

  // 守卫
  for (const g of guards) {
    if (g.stun > 0) { g.stun -= dt; continue; }
    g.stT += dt;
    const gc = {x:g.x,y:g.y,w:g.w,h:g.h};
    const d = Math.hypot(pc.x-(g.x+g.w/2), pc.y-(g.y+g.h/2));
    let vx, vy;
    if (d < 170) { // 追击
      const a = Math.atan2(pc.y-(g.y+g.h/2), pc.x-(g.x+g.w/2));
      vx = Math.cos(a) * g.spd * 1.35; vy = Math.sin(a) * g.spd * 1.35;
    } else { // 巡逻
      vx = g.dx * g.spd; vy = g.dy * g.spd;
      if (g.stT > 1.4 + Math.random()) { g.stT = 0; const r = rnd(4); g.dx=[1,0,-1,0][r]; g.dy=[0,1,0,-1][r]; }
    }
    const nxg = g.x + vx, nyg = g.y + vy;
    if (!solid(nxg, g.y, g.w, g.h)) g.x = nxg; else { g.dx *= -1; g.dy = -g.dx * (g.dy?0:1); }
    if (!solid(g.x, nyg, g.w, g.h)) g.y = nyg; else { g.dy *= -1; g.dx = -g.dy * (g.dx?0:1); }
    if (overlap(player, {x:g.x,y:g.y,w:g.w,h:g.h})) damage('👾 被巡逻守卫击中！');
  }

  // 传送门
  if (gate.open && Math.hypot(gate.x+20-pc.x, gate.y+20-pc.y) < 26) {
    score += 500 + Math.max(0, 300 - Math.floor(elapsed)) ;
    if (floor >= 3) {
      state = 'win';
      showOv('🎉 通关！', '你穿越了全部 3 层深空遗迹！最终得分 <b style="color:#7dd3fc">' + score + '</b>，用时 <b style="color:#7dd3fc">' + Math.floor(elapsed) + 's</b>。', '再 玩 一 次');
    } else {
      floor++;
      genLevel();
      updateHud();
      toast('层 ' + floor + '：遗迹结构改变！');
    }
  }
  updateHud();
}

/* ---------- 绘制 ---------- */
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  // 地面
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) {
    if (grid[y][x]) {
      ctx.fillStyle = '#0b1426';
      ctx.fillRect(x*TS, y*TS, TS, TS);
      ctx.strokeStyle = '#12203a'; ctx.lineWidth = 1;
      ctx.strokeRect(x*TS+0.5, y*TS+0.5, TS-1, TS-1);
      if ((x+y)%7===0) { ctx.fillStyle='rgba(125,211,252,.05)'; ctx.fillRect(x*TS+14,y*TS+14,4,4); }
    } else {
      ctx.fillStyle = '#050810'; ctx.fillRect(x*TS, y*TS, TS, TS);
    }
  }
  // 尖刺
  spikes.forEach(s => {
    const ext = (s.t % 3) > 1.6;
    ctx.fillStyle = ext ? '#fbbf24' : '#4b3b12';
    for (let i=0;i<4;i++) {
      const bx = s.x + (i%2)*12, by = s.y + Math.floor(i/2)*12;
      ctx.beginPath();
      ctx.moveTo(bx, by+10); ctx.lineTo(bx+5, by + (ext?0:6)); ctx.lineTo(bx+10, by+10);
      ctx.fill();
    }
  });
  // 晶核
  gems.forEach(g => {
    const fl = Math.sin(g.t*4)*3;
    ctx.save();
    ctx.translate(g.x+8, g.y+8+fl);
    ctx.rotate(g.t);
    ctx.fillStyle = '#7dd3fc';
    ctx.shadowColor = '#7dd3fc'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0,-8); ctx.lineTo(7,0); ctx.lineTo(0,8); ctx.lineTo(-7,0); ctx.closePath();
    ctx.fill();
    ctx.restore();
  });
  // 传送门
  ctx.save();
  ctx.translate(gate.x+20, gate.y+20);
  const gp = Math.sin(performance.now()/300);
  ctx.strokeStyle = gate.open ? `rgba(52,211,153,${.7+gp*.3})` : 'rgba(80,100,140,.5)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.stroke();
  if (gate.open) {
    ctx.strokeStyle = `rgba(125,211,252,${.5+gp*.5})`;
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(52,211,153,.25)';
    ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(80,100,140,.25)';
    ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  // 守卫
  guards.forEach(g => {
    const st = g.stun > 0;
    ctx.fillStyle = st ? '#64748b' : '#f87171';
    ctx.shadowColor = st ? '#64748b' : '#f87171'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(g.x+g.w/2, g.y+g.h/2, g.w/2, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0b1426';
    ctx.beginPath(); ctx.arc(g.x+g.w/2-5, g.y+g.h/2-2, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(g.x+g.w/2+5, g.y+g.h/2-2, 3.4, 0, Math.PI*2); ctx.fill();
    if (st) { ctx.fillStyle='#cbd5e1'; ctx.font='10px sans-serif'; ctx.fillText('💫', g.x+g.w/2-6, g.y-4); }
  });
  // 玩家
  if (!(inv > 0 && Math.floor(elapsed*10)%2)) {
    ctx.save();
    ctx.translate(player.x+14, player.y+14);
    ctx.rotate(player.dir);
    ctx.fillStyle = '#34d399';
    ctx.shadowColor = '#34d399'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(14,0); ctx.lineTo(-9,9); ctx.lineTo(-5,0); ctx.lineTo(-9,-9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // 技能冷却环
    if (pulseCd > 0) {
      ctx.strokeStyle = 'rgba(250,204,21,.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x+14, player.y+14, 20, -Math.PI/2, -Math.PI/2 + (1-pulseCd/5)*Math.PI*2);
      ctx.stroke();
    }
  }
  // 震退波特效
  if (pulseCd > 4.6 || (pulseCd>0 && pulseCd>4)) {}
  ctx.restore();
}

function updateHud() {
  document.getElementById('hTime').textContent = Math.floor(elapsed);
  document.getElementById('hGems').textContent = gemsGot + '/' + gemsAll;
  document.getElementById('hHp').textContent = hp;
  document.getElementById('hFloor').textContent = floor;
  document.getElementById('hScore').textContent = score;
}

/* ---------- UI ---------- */
const ov = document.getElementById('ov');
function showOv(t, d, b) {
  document.getElementById('ovTitle').textContent = t;
  document.getElementById('ovDesc').innerHTML = d;
  document.getElementById('ovBtn').textContent = b;
  ov.style.display = 'flex';
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity = 0, 1600);
}
document.getElementById('ovBtn').onclick = () => {
  ov.style.display = 'none';
  if (state === 'dead' || state === 'win') { floor = 1; score = 0; hp = 3; elapsed = 0; }
  state = 'play';
  genLevel(); updateHud();
  toast('第 1 层：收集全部晶核激活传送门');
};

/* ---------- 主循环 ---------- */
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  if (state === 'play') update(dt);
  if (grid) draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
