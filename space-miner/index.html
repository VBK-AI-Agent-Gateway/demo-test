<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际矿工 · 小行星挖矿</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(800px 500px at 50% -10%, #1b2450 0%, #070a18 60%);
    color:#e6ecff; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:20px 12px 40px; user-select:none;
  }
  h1 { font-size:1.5rem; letter-spacing:3px; }
  h1 span { color:#fbbf24; }
  .sub { color:#8b97c2; font-size:.82rem; margin:4px 0 14px; text-align:center; }

  .hud {
    display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:12px;
    font-size:.88rem;
  }
  .chip {
    background:#121a33; border:1px solid #223059; border-radius:999px;
    padding:6px 16px; font-family:monospace;
  }
  .chip b { color:#22d3ee; }
  .chip.gold b { color:#fbbf24; }

  .stage {
    position:relative; width:100%; max-width:760px; height:440px;
    background:linear-gradient(180deg,#0a0f24, #111736);
    border:1px solid #223059; border-radius:18px; overflow:hidden;
    box-shadow:0 16px 50px rgba(0,0,0,.5), inset 0 0 60px rgba(91,140,255,.06);
    touch-action:none;
  }
  /* 星空 */
  .stage::before {
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 20%, #cfe0ff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 40% 70%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 85% 65%, #cfe0ff 50%, transparent 51%),
      radial-gradient(1px 1px at 10% 85%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 45%, #fff 50%, transparent 51%);
    animation:twinkle 3s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity:.5; } to { opacity:1; } }

  canvas { position:absolute; inset:0; width:100%; height:100%; }

  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    background:rgba(7,10,24,.82); backdrop-filter:blur(3px); z-index:5; text-align:center;
    padding:20px;
  }
  .overlay.hide { display:none; }
  .overlay h2 { font-size:1.7rem; letter-spacing:2px; }
  .overlay p { color:#8b97c2; font-size:.9rem; line-height:2; max-width:420px; }
  .overlay .keys { font-size:.8rem; color:#22d3ee; font-family:monospace; }
  .start-btn {
    background:linear-gradient(135deg,#5b8cff,#22d3ee); color:#081020;
    border:none; border-radius:12px; padding:13px 40px; font-size:1.05rem;
    font-weight:900; cursor:pointer; letter-spacing:2px;
  }
  .start-btn:hover { filter:brightness(1.12); transform:translateY(-2px); transition:.15s; }

  .toast {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:#121a33ee; border:1px solid #223059; border-radius:999px;
    padding:7px 20px; font-size:.85rem; opacity:0; transition:.3s; z-index:4;
    pointer-events:none;
  }
  .toast.show { opacity:1; top:44px; }
</style>
</head>
<body>

<h1>🚀 星际<span>矿工</span> · 小行星挖矿</h1>
<div class="sub">驾驶飞船在小行星带采掘矿石，躲开陨石，满载而归！</div>

<div class="hud">
  <div class="chip">⛏️ 矿石 <b id="ore">0</b></div>
  <div class="chip gold">💰 金币 <b id="coin">0</b></div>
  <div class="chip">❤️ 耐久 <b id="hp">100</b></div>
  <div class="chip">⏱️ 时间 <b id="time">60</b>s</div>
  <div class="chip">🏆 最高 <b id="best">0</b></div>
</div>

<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="toast" id="toast"></div>

  <div class="overlay" id="ovStart">
    <h2>🪐 星际矿工</h2>
    <p>小行星带藏着丰富的矿脉。<br>飞过去贴近矿石即可采集，小心红色陨石和炮弹冷却。</p>
    <div class="keys">⬅️➡️⬆️⬇️ / WASD 移动 · 按住 空格 连发采集光束</div>
    <button class="start-btn" onclick="start()">开 始 游 戏</button>
  </div>

  <div class="overlay hide" id="ovEnd">
    <h2 id="endTitle">⏱️ 时间到！</h2>
    <p id="endInfo"></p>
    <button class="start-btn" onclick="start()">再 来 一 局</button>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let W, H;
function resize() { W = cv.width = stage.clientWidth; H = cv.height = stage.clientHeight; }
resize(); addEventListener('resize', resize);

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

let running = false, raf = null;
let ship, ores, rocks, bullets, parts, spawnT, bulletT;
let ore = 0, coin = 0, hp = 100, timeLeft = 60;
let best = +(localStorage.getItem('minerBest') || 0);
document.getElementById('best').textContent = best;

const rnd = (a, b) => a + Math.random() * (b - a);

function start() {
  resize();
  ship = { x: W / 2, y: H / 2, r: 16, vx: 0, vy: 0, cool: 0, inv: 0 };
  ores = []; rocks = []; bullets = []; parts = [];
  spawnT = 0; bulletT = 0;
  ore = 0; coin = 0; hp = 100; timeLeft = 60;
  for (let i = 0; i < 8; i++) spawnOre();
  for (let i = 0; i < 3; i++) spawnRock();
  document.getElementById('ovStart').classList.add('hide');
  document.getElementById('ovEnd').classList.add('hide');
  updateHud();
  running = true;
  last = performance.now();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function spawnOre() {
  const type = Math.random() < 0.15 ? 'gold' : (Math.random() < 0.3 ? 'crystal' : 'iron');
  const val = type === 'gold' ? 30 : type === 'crystal' ? 15 : 5;
  const pts = [];
  const n = 6, r = rnd(10, 18);
  for (let i = 0; i < n; i++) pts.push(rnd(r * .6, r));
  ores.push({ x: rnd(30, W - 30), y: rnd(30, H - 30), r, type, val, pts, ph: rnd(0, 6.28) });
}

function spawnRock() {
  const edge = Math.floor(rnd(0, 4));
  const speed = rnd(0.6, 1.6) + (60 - timeLeft) * 0.02;
  let x, y, vx, vy;
  if (edge === 0) { x = -30; y = rnd(0, H); vx = speed; vy = rnd(-0.5, 0.5); }
  else if (edge === 1) { x = W + 30; y = rnd(0, H); vx = -speed; vy = rnd(-0.5, 0.5); }
  else if (edge === 2) { x = rnd(0, W); y = -30; vx = rnd(-0.5, 0.5); vy = speed; }
  else { x = rnd(0, W); y = H + 30; vx = rnd(-0.5, 0.5); vy = -speed; }
  const n = 9, r = rnd(16, 30), pts = [];
  for (let i = 0; i < n; i++) pts.push(rnd(r * .55, r));
  rocks.push({ x, y, vx, vy, r, pts, rot: rnd(0, 6.28), rv: rnd(-0.03, 0.03) });
}

function burst(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), s = rnd(1, 4);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(20, 45), color });
  }
}

let toastTm;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTm);
  toastTm = setTimeout(() => t.classList.remove('show'), 1200);
}

function updateHud() {
  document.getElementById('ore').textContent = ore;
  document.getElementById('coin').textContent = coin;
  document.getElementById('hp').textContent = Math.max(0, Math.ceil(hp));
  document.getElementById('time').textContent = Math.ceil(timeLeft);
  document.getElementById('best').textContent = best;
}

let last = 0, acc = 0;
function loop(now) {
  if (!running) return;
  const dt = Math.min(50, now - last); last = now;
  update(dt);
  draw();
  raf = requestAnimationFrame(loop);
}

function update(dt) {
  const k = dt / 16.7;

  // 移动
  let ax = 0, ay = 0;
  if (keys.ArrowLeft || keys.KeyA) ax -= 1;
  if (keys.ArrowRight || keys.KeyD) ax += 1;
  if (keys.ArrowUp || keys.KeyW) ay -= 1;
  if (keys.ArrowDown || keys.KeyS) ay += 1;
  if (ax && ay) { ax *= 0.707; ay *= 0.707; }
  ship.vx += ax * 0.55 * k; ship.vy += ay * 0.55 * k;
  ship.vx *= Math.pow(0.92, k); ship.vy *= Math.pow(0.92, k);
  ship.x += ship.vx * k; ship.y += ship.vy * k;
  ship.x = Math.max(ship.r, Math.min(W - ship.r, ship.x));
  ship.y = Math.max(ship.r, Math.min(H - ship.r, ship.y));
  if (ship.cool > 0) ship.cool -= dt;
  if (ship.inv > 0) ship.inv -= dt;

  // 采集光束（按住空格）
  if (keys.Space && ship.cool <= 0) {
    ship.cool = 260;
    // 找最近矿石
    let target = null, bd = 1e9;
    ores.forEach(o => {
      const d = Math.hypot(o.x - ship.x, o.y - ship.y);
      if (d < bd) { bd = d; target = o; }
    });
    if (target && bd < 220) {
      bullets.push({ x: ship.x, y: ship.y, tx: target.x, ty: target.y, life: 10, target });
    } else {
      bullets.push({ x: ship.x, y: ship.y, tx: ship.x + ship.vx * 8, ty: ship.y + ship.vy * 8, life: 6, target: null });
    }
  }

  // 炮弹
  bullets = bullets.filter(b => {
    b.life--;
    if (b.target && b.target.got) return false;
    if (b.target && !b.target.got) {
      const o = b.target;
      o.x += (ship.x - o.x) * 0.06 * k;
      o.y += (ship.y - o.y) * 0.06 * k;
      const d = Math.hypot(o.x - ship.x, o.y - ship.y);
      if (d < 34) {
        o.got = true;
        ore += 1;
        coin += o.val;
        burst(o.x, o.y, o.type === 'gold' ? '#fbbf24' : o.type === 'crystal' ? '#22d3ee' : '#94a3b8');
        if (o.type === 'gold') toast('💎 黄金矿 +30💰');
        ores.splice(ores.indexOf(o), 1);
        spawnOre();
        updateHud();
        return false;
      }
    }
    return b.life > 0;
  });

  // 矿石漂浮
  ores.forEach(o => o.ph += 0.03 * k);

  // 陨石
  spawnT -= dt;
  if (spawnT <= 0) { spawnT = Math.max(700, 2200 - (60 - timeLeft) * 25); spawnRock(); }
  rocks.forEach(r => {
    r.x += r.vx * k; r.y += r.vy * k; r.rot += r.rv * k;
    // 撞船
    if (ship.inv <= 0 && Math.hypot(r.x - ship.x, r.y - ship.y) < r.r + ship.r - 4) {
      hp -= 25; ship.inv = 1000;
      burst(ship.x, ship.y, '#f87171', 18);
      toast('💥 撞上陨石！-25 耐久');
      ship.vx = (ship.x - r.x) * 0.3; ship.vy = (ship.y - r.y) * 0.3;
      updateHud();
      if (hp <= 0) return end(false);
    }
  });
  rocks = rocks.filter(r => r.x > -80 && r.x < W + 80 && r.y > -80 && r.y < H + 80);

  // 粒子
  parts = parts.filter(p => {
    p.x += p.vx * k; p.y += p.vy * k; p.life -= k;
    return p.life > 0;
  });

  // 时间
  timeLeft -= dt / 1000;
  if (timeLeft <= 0) { timeLeft = 0; updateHud(); return end(true); }
  if ((acc += dt) > 200) { acc = 0; updateHud(); }
}

function end(win) {
  running = false;
  cancelAnimationFrame(raf);
  const score = coin;
  if (score > best) { best = score; localStorage.setItem('minerBest', best); }
  document.getElementById('endTitle').textContent = win ? '⏱️ 时间到！' : '💥 飞船损毁！';
  document.getElementById('endInfo').innerHTML =
    '⛏️ 采集 <b>' + ore + '</b> 块矿石<br>💰 总收益 <b>' + coin + '</b> 金币<br>' +
    (score >= best && score > 0 ? '🎉 新纪录！' : '🏆 最高纪录：' + best);
  document.getElementById('ovEnd').classList.remove('hide');
  updateHud();
}

/* ---------- 绘制 ---------- */
function poly(o, fill, stroke) {
  ctx.save();
  ctx.translate(o.x, o.y);
  if (o.rot) ctx.rotate(o.rot);
  ctx.beginPath();
  o.pts.forEach((r, i) => {
    const a = i / o.pts.length * Math.PI * 2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 矿石
  ores.forEach(o => {
    const glow = Math.sin(o.ph) * 3;
    ctx.save();
    ctx.shadowBlur = 14 + glow * 3;
    ctx.shadowColor = o.type === 'gold' ? '#fbbf24' : o.type === 'crystal' ? '#22d3ee' : '#94a3b8';
    poly(o, o.type === 'gold' ? '#b45309' : o.type === 'crystal' ? '#0e7490' : '#475569',
         o.type === 'gold' ? '#fde68a' : o.type === 'crystal' ? '#67e8f9' : '#94a3b8');
    ctx.restore();
  });

  // 陨石
  rocks.forEach(r => poly(r, '#3f3f46', '#71717a'));

  // 光束
  bullets.forEach(b => {
    const p = 1 - b.life / 10;
    ctx.strokeStyle = 'rgba(52,211,153,' + (0.3 + p * 0.7) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.tx, b.ty); ctx.stroke();
    ctx.fillStyle = '#a7f3d0';
    ctx.beginPath(); ctx.arc(b.tx, b.ty, 4, 0, 6.28); ctx.fill();
  });

  // 飞船
  if (ship) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    const ang = Math.atan2(ship.vy, ship.vx);
    if (Math.hypot(ship.vx, ship.vy) > 0.5) ctx.rotate(ang + Math.PI / 2);
    const blink = ship.inv > 0 && Math.floor(ship.inv / 100) % 2 === 0;
    if (!blink) {
      // 尾焰
      if (Math.hypot(ship.vx, ship.vy) > 1) {
        ctx.fillStyle = 'rgba(34,211,238,.7)';
        ctx.beginPath(); ctx.moveTo(-5, 14); ctx.lineTo(0, 24 + Math.random() * 6); ctx.lineTo(5, 14); ctx.fill();
      }
      ctx.shadowBlur = 16; ctx.shadowColor = '#5b8cff';
      ctx.fillStyle = '#dbe4ff';
      ctx.beginPath();
      ctx.moveTo(0, -16); ctx.lineTo(12, 14); ctx.lineTo(0, 8); ctx.lineTo(-12, 14);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath(); ctx.arc(0, -2, 4.5, 0, 6.28); ctx.fill();
    }
    ctx.restore();
  }

  // 粒子
  parts.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    ctx.globalAlpha = 1;
  });
}

updateHud();
</script>
</body>
</html>
