<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · 像素街机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Courier New", monospace; color: #e0e0ff; gap: 14px; padding: 16px;
  }
  h1 { font-size: 28px; letter-spacing: 6px; text-shadow: 0 0 12px #6cf, 0 0 30px #6cf; }
  .hud { display: flex; gap: 28px; font-size: 16px; }
  .hud span b { color: #6cf; }
  canvas {
    background: #10141f; border: 3px solid #6cf; border-radius: 6px;
    box-shadow: 0 0 24px rgba(102,204,255,.45);
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(10,12,24,.82); border-radius: 6px; text-align: center;
  }
  #overlay h2 { color: #6cf; font-size: 26px; letter-spacing: 3px; }
  #overlay p { color: #aab; line-height: 1.8; font-size: 14px; }
  #overlay .btn {
    background: #6cf; color: #06121f; border: none; padding: 10px 26px;
    font-size: 17px; font-weight: bold; letter-spacing: 3px; border-radius: 4px;
    cursor: pointer; font-family: inherit;
  }
  #overlay .btn:hover { background: #9df; }
  .stage { position: relative; }
  .hint { color: #789; font-size: 13px; }
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div class="hud">
  <span>得分 <b id="score">0</b></span>
  <span>最高 <b id="best">0</b></span>
  <span>速度 <b id="speed">1</b></span>
</div>
<div class="stage">
  <canvas id="game" width="440" height="440"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">贪吃蛇</h2>
    <p id="ovText">方向键 / WASD 控制移动<br>吃掉发光食物得分，别撞墙也别咬到自己</p>
    <button class="btn" id="ovBtn">开 始</button>
  </div>
</div>
<div class="hint">方向键 或 WASD 移动 · 空格暂停</div>

<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const GRID = 20, CELL = cv.width / GRID;

let snake, dir, nextDir, food, score, best = 0, timer = null, running = false, baseInterval = 140;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const speedEl = document.getElementById('speed');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const ovBtn = document.getElementById('ovBtn');

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir;
  score = 0;
  placeFood();
  updateHud();
}

function placeFood() {
  do {
    food = { x: (Math.random()*GRID)|0, y: (Math.random()*GRID)|0 };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function updateHud() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  speedEl.textContent = Math.floor(score / 50) + 1;
}

function interval() {
  return Math.max(60, baseInterval - Math.floor(score / 50) * 12);
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    best = Math.max(best, score);
    placeFood();
    updateHud();
    clearInterval(timer);
    timer = setInterval(step, interval());
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#10141f';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(cv.width, i*CELL); ctx.stroke();
  }
  const pulse = 0.75 + 0.25 * Math.sin(Date.now() / 150);
  ctx.save();
  ctx.shadowColor = '#f66'; ctx.shadowBlur = 16 * pulse;
  ctx.fillStyle = '#ff5566';
  const fs = CELL * 0.7 * pulse;
  ctx.beginPath();
  ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, fs/2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  snake.forEach((s, i) => {
    const t = i / snake.length;
    ctx.fillStyle = i === 0 ? '#aef' : `rgb(${70 - t*30|0}, ${220 - t*100|0}, ${150 - t*60|0})`;
    ctx.shadowColor = i === 0 ? '#6cf' : 'transparent';
    ctx.shadowBlur = i === 0 ? 12 : 0;
    const pad = i === 0 ? 1 : 2;
    ctx.fillRect(s.x*CELL + pad, s.y*CELL + pad, CELL - pad*2, CELL - pad*2);
  });
  ctx.shadowBlur = 0;
  const h = snake[0];
  ctx.fillStyle = '#06121f';
  const ex = h.x*CELL + CELL/2 + dir.x*5, ey = h.y*CELL + CELL/2 + dir.y*5;
  ctx.beginPath(); ctx.arc(ex - 3, ey - 3, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex + 3, ey + 3, 2, 0, Math.PI*2); ctx.fill();
}

function start() {
  reset();
  overlay.style.display = 'none';
  running = true;
  draw();
  clearInterval(timer);
  timer = setInterval(step, interval());
}

function gameOver() {
  clearInterval(timer);
  timer = null;
  running = false;
  ovTitle.textContent = '游戏结束';
  ovText.innerHTML = `本局得分 <b style="color:#6cf">${score}</b> · 最高 <b style="color:#6cf">${best}</b><br>再接再厉！`;
  ovBtn.textContent = '再来一局';
  overlay.style.display = 'flex';
}

function togglePause() {
  if (!running) return;
  if (timer) {
    clearInterval(timer); timer = null;
    ovTitle.textContent = '已暂停'; ovText.textContent = '按空格继续'; ovBtn.textContent = '继续';
    overlay.style.display = 'flex';
  } else {
    overlay.style.display = 'none';
    timer = setInterval(step, interval());
  }
}

ovBtn.addEventListener('click', () => {
  if (running && timer === null) return togglePause();
  start();
});

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = {
    arrowup: {x:0,y:-1}, w: {x:0,y:-1},
    arrowdown: {x:0,y:1}, s: {x:0,y:1},
    arrowleft: {x:-1,y:0}, a: {x:-1,y:0},
    arrowright: {x:1,y:0}, d: {x:1,y:0}
  };
  if (map[k]) {
    e.preventDefault();
    const nd = map[k];
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  } else if (k === ' ') {
    e.preventDefault();
    if (!running) start(); else togglePause();
  }
});

let tsX = 0, tsY = 0;
cv.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }, {passive:true});
cv.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tsX, dy = e.changedTouches[0].clientY - tsY;
  if (Math.abs(dx) + Math.abs(dy) < 24) return;
  const nd = Math.abs(dx) > Math.abs(dy)
    ? {x: dx > 0 ? 1 : -1, y: 0}
    : {x: 0, y: dy > 0 ? 1 : -1};
  if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
}, {passive:true});

reset();
draw();
</script>
</body>
</html>
