       slot:{x:88,y:34}, path:"M-6,6 L26,-34 L42,-34 L42,6 Z M-40,-6 L12,-6 L12,8 L-40,8 Z", color:"#577590"},
      {id:"booster", name:"助推火箭", icon:"🧨",
       know:"<b>助推火箭：</b>挂在机翼下的<b>一次性小火箭</b>，起飞时一起点火，帮飞机在短时间内冲上超高速。",
       slot:{x:52,y:76}, path:"M-30,-10 L20,-10 Q30,-10 30,0 Q30,10 20,10 L-30,10 Q-38,0 -30,-10 Z M-30,-10 L-44,0 L-30,10", color:"#9b2226"}
    ]
  }
];

/* ================= 状态 ================= */
const board = document.getElementById('board');
const sil = document.getElementById('sil');
const tray = document.getElementById('tray');
const scoreEl = document.getElementById('score');
const trophyEl = document.getElementById('trophy');
let level = 0, score = 0, placed = {}, selPiece = null;
let done = JSON.parse(localStorage.getItem('plane_puzzle_done') || '[]');

const $ = id => document.getElementById(id);
function say(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.9; speechSynthesis.speak(u);}catch(e){} }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* 生成轮廓 SVG（虚线槽） */
function renderBoard(){
  const L = LEVELS[level];
  let html = '';
  L.parts.forEach(p=>{
    const ok = placed[p.id];
    const t = `translate(${p.slot.x*6.4}, ${p.slot.y*3.6})`;
    if(!ok){
      html += `<g class="slot" data-id="${p.id}" transform="${t}">
        <path d="${p.path}" class="ghost" fill="${p.color}22"></path>
      </g>`;
    } else {
      html += `<g class="placed-piece" data-id="${p.id}" transform="${t}">
        <path d="${p.path}" fill="${p.color}" stroke="#173b5c" stroke-width="2"></path>
        <title>${p.name}</title>
      </g>`;
    }
  });
  sil.innerHTML = html;
}

/* 零件托盘 */
function renderTray(){
  const L = LEVELS[level];
  tray.innerHTML = '';
  L.parts.filter(p=>!placed[p.id]).forEach(p=>{
    const d = document.createElement('div');
    d.className = 'traypiece';
    d.dataset.id = p.id;
    d.innerHTML = `<svg viewBox="-60 -35 120 70"><path d="${p.path}" fill="${p.color}" stroke="#173b5c" stroke-width="2"></path></svg><div class="pname">${p.icon} ${p.name}</div>`;
    tray.appendChild(d);
  });
  if(tray.children.length===0){
    tray.innerHTML = '<div style="font-size:15px;color:#12a05a;padding:20px">🎉 全部零件都装上啦！</div>';
  }
}

/* 关卡条 */
function renderLevels(){
  const bar = $('levelbar');
  bar.innerHTML = LEVELS.map((L,i)=>
    `<button class="levelbtn ${i===level?'active':''} ${done.includes(i)?'done':''}" data-i="${i}">${L.name}</button>`).join('');
}

function renderHud(){
  scoreEl.textContent = '⭐ ' + score + ' 分';
  trophyEl.textContent = done.length ? `🏆 已通关 ${done.length}/${LEVELS.length} 架飞机` : '';
}

function renderAll(){ renderLevels(); renderBoard(); renderTray(); renderHud(); }

/* ================= 放置逻辑 ================= */
function tryPlace(pid, slotId){
  if(pid !== slotId){ // 放错
    const g = sil.querySelector(`.slot[data-id="${slotId}"]`);
    if(g){ g.classList.add('wrong'); setTimeout(()=>g.classList.remove('wrong'),400); }
    const tp = tray.querySelector(`.traypiece[data-id="${pid}"]`);
    if(tp){ tp.classList.add('wrong'); setTimeout(()=>tp.classList.remove('wrong'),400); }
    say('哎呀，这个位置不对哦，再试试！');
    return false;
  }
  placed[pid] = true;
  const P = LEVELS[level].parts.find(p=>p.id===pid);
  score += 10; renderAll();
  showInfo(P, ()=>{ checkWin(); });
  return true;
}

function checkWin(){
  const L = LEVELS[level];
  if(Object.keys(placed).length === L.parts.length){
    score += 50; renderHud();
    if(!done.includes(level)){ done.push(level); localStorage.setItem('plane_puzzle_done', JSON.stringify(done)); }
    renderLevels();
    $('winTitle').textContent = L.name + ' 拼好啦！';
    $('winKnow').innerHTML = '<b>这架飞机的本领：</b>' + L.summary;
    $('ovWin').classList.add('show');
    say('太棒了！' + L.name + '拼装完成！');
  }
}

/* 零件知识弹窗 */
function showInfo(P, cb){
  $('infoIcon').textContent = P.icon;
  $('infoName').textContent = P.name + ' 装好了！';
  $('infoKnow').innerHTML = P.know;
  $('ovInfo').classList.add('show');
  $('ovInfo').dataset.txt = P.name + '。' + P.know.replace(/<[^>]+>/g,'');
  $('ovInfo')._cb = cb;
}
$('btnInfoClose').onclick = () => { $('ovInfo').classList.remove('show'); const cb=$('ovInfo')._cb; $('ovInfo')._cb=null; if(cb) cb(); };
$('btnSay').onclick = () => say($('ovInfo').dataset.txt || '');
$('ovInfo').addEventListener('click', e=>{ if(e.target===$('ovInfo')) $('btnInfoClose').click(); });

/* ================= 拖拽 / 点选 ================= */
let dragId = null, dragEl = null;
function onDown(e){
  const tp = e.target.closest('.traypiece');
  if(tp){
    dragId = tp.dataset.id; dragEl = tp;
    tp.classList.add('dragging');
    tp.setPointerCapture && tp.setPointerCapture(e.pointerId);
  }
}
function onMove(e){
  if(!dragEl) return;
  e.preventDefault();
}
function onUp(e){
  if(!dragEl) return;
  const id = dragId; dragEl.classList.remove('dragging');
  dragEl = null; dragId = null;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const slotG = el && el.closest && el.closest('.slot');
  if(slotG){ tryPlace(id, slotG.dataset.id); }
}
tray.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove, {passive:false});
window.addEventListener('pointerup', onUp);

/* 点选：点零件 -> 点槽位 */
tray.addEventListener('click', e=>{
  const tp = e.target.closest('.traypiece');
  if(tp){
    if(selPiece===tp){ tp.style.borderColor='transparent'; selPiece=null; return; }
    if(selPiece) selPiece.style.borderColor='transparent';
    selPiece = tp; tp.style.borderColor='#ffb703';
    traybarHint('已选中 <b>'+tp.querySelector('.pname').textContent+'</b>，现在点上面匹配的虚线位置 👉');
  }
});
sil.addEventListener('click', e=>{
  const g = e.target.closest('.slot');
  if(g && selPiece){
    tryPlace(selPiece.dataset.id, g.dataset.id);
    if(selPiece) selPiece.style.borderColor='transparent';
    selPiece=null;
    traybarHint('👇 把零件拖到虚线位置（或点零件、再点虚线位置）');
  }
});
function traybarHint(html){ $('traybar').innerHTML = html; }

/* ================= 按钮 ================= */
$('btnReset').onclick = () => { placed={}; selPiece=null; renderAll(); traybarHint('👇 把零件拖到虚线位置（或点零件、再点虚线位置）'); };
$('btnAgain').onclick = () => { $('ovWin').classList.remove('show'); $('btnReset').click(); };
$('btnNext').onclick = () => {
  $('ovWin').classList.remove('show');
  level = (level+1)%LEVELS.length;
  placed = {}; selPiece=null; renderAll();
  traybarHint('👇 新的飞机：'+LEVELS[level].name+'，把零件拖到虚线位置吧！');
};
$('btnAll').onclick = () => {
  $('bookKnow').innerHTML = LEVELS.map((L,i)=>
    `<p style="margin:6px 0 2px"><b style="color:#0b5ca8">${L.name}</b></p>` +
    L.parts.map(p=>`<p>• ${p.icon} <b>${p.name.replace(/（.*?）/,'')}</b>：${p.know.replace(/<b>.*?<\/b>/,'').replace(/&quot;/g,'"')}</p>`).join('')
  ).join('<hr style="border:none;border-top:1px dashed #b9dff5;margin:8px 0">');
  $('ovBook').classList.add('show');
};
$('btnBookClose').onclick = () => $('ovBook').classList.remove('show');

/* 关卡切换 */
$('levelbar').addEventListener('click', e=>{
  const b = e.target.closest('.levelbtn');
  if(!b) return;
  level = +b.dataset.i; placed={}; selPiece=null; renderAll();
  traybarHint('👇 ' + LEVELS[level].name + '：把零件拖到虚线位置吧！');
});

renderAll();
</script>
</body>
</html>
