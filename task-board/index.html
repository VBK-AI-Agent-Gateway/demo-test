<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Board · 任务看板</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel2: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --todo: #64748b;
    --doing: #f59e0b;
    --done: #10b981;
    --danger: #ef4444;
    --radius: 12px;
    --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, transparent 60%),
                radial-gradient(900px 500px at 90% 110%, #134e4a 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,.06);
    backdrop-filter: blur(6px); position: sticky; top: 0; z-index: 10;
    background: rgba(15,23,42,.7);
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  .stats { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
  .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text], select, button {
    font: inherit; border-radius: 8px; border: 1px solid rgba(255,255,255,.1);
    background: var(--panel); color: var(--text); padding: 8px 10px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.18); }
  button { cursor: pointer; background: linear-gradient(180deg, #2563eb, #1d4ed8); border: none; color: #fff; font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; border: 1px solid rgba(255,255,255,.14); color: var(--muted); font-weight: 500; }
  button.ghost:hover { color: var(--text); border-color: rgba(255,255,255,.3); }
  main { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
    align-items: start;
  }
  .col {
    background: rgba(30,41,59,.65);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    min-height: 220px;
    display: flex; flex-direction: column;
  }
  .col-head {
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,.07);
    background: rgba(255,255,255,.02);
  }
  .col-head h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.todo { background: var(--todo); }
  .dot.doing { background: var(--doing); }
  .dot.done { background: var(--done); }
  .count { font-size: 12px; color: var(--muted); background: rgba(255,255,255,.06); padding: 2px 8px; border-radius: 999px; }
  .cards { padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 12px;
    cursor: grab;
    transition: transform .12s, box-shadow .12s, border-color .12s;
    position: relative;
  }
  .card:hover { transform: translateY(-2px); border-color: rgba(56,189,248,.5); box-shadow: 0 8px 18px rgba(0,0,0,.3); }
  .card.dragging { opacity: .5; transform: scale(.98); }
  .card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; word-break: break-word; }
  .card .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(56,189,248,.15); color: var(--accent); }
  .tag.high { background: rgba(239,68,68,.18); color: #fca5a5; }
  .tag.mid { background: rgba(245,158,11,.18); color: #fcd34d; }
  .tag.low { background: rgba(16,185,129,.18); color: #6ee7b7; }
  .card .actions { display: flex; gap: 6px; margin-top: 10px; }
  .card .actions button { font-size: 12px; padding: 4px 8px; border-radius: 6px; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 10px; opacity: .7; }
  .col.drop-active { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .fab-bar { position: fixed; right: 22px; bottom: 22px; display: flex; gap: 10px; z-index: 20; }
  .fab-bar button { padding: 12px 18px; border-radius: 999px; box-shadow: var(--shadow); font-size: 14px; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(2,6,23,.7); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 22px; width: 100%; max-width: 440px; box-shadow: var(--shadow);
  }
  .modal h3 { margin: 0 0 14px; font-size: 17px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 13px; color: var(--muted); }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
    background: var(--panel2); color: var(--text); padding: 10px 16px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.12); box-shadow: var(--shadow); opacity: 0;
    transition: all .25s; pointer-events: none; font-size: 14px; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; opacity: .7; }
  @media (max-width: 720px) {
    header { flex-direction: column; align-items: stretch; }
    main { padding: 14px; }
    .fab-bar { left: 16px; right: 16px; justify-content: center; }
  }
</style>
</head>
<body>
<header>
  <h1><span>◆</span> Task Board <span style="color:var(--muted);font-weight:400;font-size:13px">任务看板</span></h1>
  <div class="stats">
    <div class="stat">待办 <b id="s-todo">0</b></div>
    <div class="stat">进行中 <b id="s-doing">0</b></div>
    <div class="stat">已完成 <b id="s-done">0</b></div>
    <div class="stat">总计 <b id="s-total">0</b></div>
  </div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="搜索任务… (Ctrl+K)" autocomplete="off">
    <select id="filter">
      <option value="all">全部优先级</option>
      <option value="high">高</option>
      <option value="mid">中</option>
      <option value="low">低</option>
    </select>
    <button class="ghost" id="btn-reset" title="恢复示例数据">重置</button>
  </div>
</header>

<main>
  <div class="board" id="board">
    <section class="col" data-status="todo">
      <div class="col-head"><h2><span class="dot todo"></span>待办 To Do</h2><span class="count" id="c-todo">0</span></div>
      <div class="cards" id="col-todo"></div>
    </section>
    <section class="col" data-status="doing">
      <div class="col-head"><h2><span class="dot doing"></span>进行中 In Progress</h2><span class="count" id="c-doing">0</span></div>
      <div class="cards" id="col-doing"></div>
    </section>
    <section class="col" data-status="done">
      <div class="col-head"><h2><span class="dot done"></span>已完成 Done</h2><span class="count" id="c-done">0</span></div>
      <div class="cards" id="col-done"></div>
    </section>
  </div>
</main>

<div class="fab-bar">
  <button id="btn-add">＋ 新建任务</button>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modal-title">新建任务</h3>
    <div class="field">
      <label for="f-title">标题</label>
      <input type="text" id="f-title" placeholder="例如：修复登录 500" maxlength="120">
    </div>
    <div class="field">
      <label for="f-desc">描述（可选）</label>
      <input type="text" id="f-desc" placeholder="补充细节…" maxlength="240">
    </div>
    <div class="field">
      <label for="f-priority">优先级</label>
      <select id="f-priority">
        <option value="high">高</option>
        <option value="mid" selected>中</option>
        <option value="low">低</option>
      </select>
    </div>
    <div class="field">
      <label for="f-status">状态</label>
      <select id="f-status">
        <option value="todo">待办</option>
        <option value="doing">进行中</option>
        <option value="done">已完成</option>
      </select>
    </div>
    <div class="actions">
      <button class="ghost" id="btn-cancel">取消</button>
      <button id="btn-save">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer>纯前端零依赖 · localStorage 持久化 · 支持拖拽 / 搜索 / 优先级筛选</footer>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'task-board-v1';
  var PRI_LABEL = { high: '高', mid: '中', low: '低' };
  var STATUS_LABEL = { todo: '待办', doing: '进行中', done: '已完成' };

  var seed = [
    { id: 1, title: '设计首页原型', desc: '低保真 + 高保真各一版', priority: 'high', status: 'doing', created: Date.now() - 86400000 * 3 },
    { id: 2, title: '撰写接口文档', desc: 'task CRUD / auth', priority: 'mid', status: 'todo', created: Date.now() - 86400000 * 2 },
    { id: 3, title: '修复暗色模式对比度', desc: '按钮文字在深色下过暗', priority: 'low', status: 'todo', created: Date.now() - 86400000 },
    { id: 4, title: '部署 staging 环境', desc: 'CI 自动触发', priority: 'mid', status: 'done', created: Date.now() - 86400000 * 5 },
    { id: 5, title: '编写单元测试', desc: '覆盖关键分支', priority: 'high', status: 'done', created: Date.now() - 86400000 * 4 }
  ];

  var state = load();
  var filterPriority = 'all';
  var searchQ = '';
  var editingId = null;
  var nextId = state.reduce(function (m, t) { return Math.max(m, t.id); }, 0) + 1;

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr;
      }
    } catch (e) { /* 忽略损坏数据 */ }
    return seed.slice();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* 存储满则忽略 */ }
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function matches(t) {
    if (filterPriority !== 'all' && t.priority !== filterPriority) return false;
    if (!searchQ) return true;
    var q = searchQ.toLowerCase();
    return (t.title || '').toLowerCase().indexOf(q) !== -1
        || (t.desc || '').toLowerCase().indexOf(q) !== -1;
  }

  function cardHTML(t) {
    return '' +
      '<article class="card" draggable="true" data-id="' + t.id + '">' +
        '<h3>' + esc(t.title) + '</h3>' +
        (t.desc ? '<div class="meta" style="margin-bottom:8px">' + esc(t.desc) + '</div>' : '') +
        '<div class="meta">' +
          '<div class="tags">' +
            '<span class="tag ' + t.priority + '">' + PRI_LABEL[t.priority] + '</span>' +
            '<span class="tag">' + STATUS_LABEL[t.status] + '</span>' +
          '</div>' +
          '<span>' + timeAgo(t.created) + '</span>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="ghost" data-act="edit">编辑</button>' +
          (t.status !== 'doing' ? '<button class="ghost" data-act="to-doing">进行中</button>' : '') +
          (t.status !== 'done' ? '<button class="ghost" data-act="to-done">完成</button>' : '') +
          (t.status !== 'todo' ? '<button class="ghost" data-act="to-todo">退回</button>' : '') +
          '<button class="ghost" data-act="del" style="color:#fca5a5">删除</button>' +
        '</div>' +
      '</article>';
  }

  function timeAgo(ts) {
    var diff = Date.now() - (ts || Date.now());
    var min = Math.floor(diff / 60000);
    if (min < 1) return '刚刚';
    if (min < 60) return min + ' 分钟前';
    var h = Math.floor(min / 60);
    if (h < 24) return h + ' 小时前';
    var d = Math.floor(h / 24);
    if (d < 30) return d + ' 天前';
    return new Date(ts).toLocaleDateString();
  }

  function render() {
    var byStatus = { todo: [], doing: [], done: [] };
    state.forEach(function (t) { if (byStatus[t.status]) byStatus[t.status].push(t); });

    Object.keys(byStatus).forEach(function (st) {
      var list = byStatus[st].filter(matches);
      // 已完成的排后面
      list.sort(function (a, b) { return (b.created || 0) - (a.created || 0); });
      var el = document.getElementById('col-' + st);
      el.innerHTML = list.length
        ? list.map(cardHTML).join('')
        : '<div class="empty">' + (searchQ || filterPriority !== 'all' ? '没有匹配的任务' : '拖拽卡片到这里') + '</div>';
      document.getElementById('c-' + st).textContent = list.length;
    });

    document.getElementById('s-todo').textContent = byStatus.todo.length;
    document.getElementById('s-doing').textContent = byStatus.doing.length;
    document.getElementById('s-done').textContent = byStatus.done.length;
    document.getElementById('s-total').textContent = state.length;
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  // ---- 弹窗 ----
  var modalBg = document.getElementById('modal-bg');
  function openModal(task) {
    editingId = task ? task.id : null;
    document.getElementById('modal-title').textContent = task ? '编辑任务' : '新建任务';
    document.getElementById('f-title').value = task ? task.title : '';
    document.getElementById('f-desc').value = task ? (task.desc || '') : '';
    document.getElementById('f-priority').value = task ? task.priority : 'mid';
    document.getElementById('f-status').value = task ? task.status : 'todo';
    modalBg.classList.add('open');
    setTimeout(function () { document.getElementById('f-title').focus(); }, 30);
  }
  function closeModal() { modalBg.classList.remove('open'); editingId = null; }

  function saveModal() {
    var title = document.getElementById('f-title').value.trim();
    if (!title) { toast('标题不能为空'); return; }
    var data = {
      title: title,
      desc: document.getElementById('f-desc').value.trim(),
      priority: document.getElementById('f-priority').value,
      status: document.getElementById('f-status').value
    };
    if (editingId) {
      state.forEach(function (t) { if (t.id === editingId) { Object.assign(t, data); } });
      toast('已保存修改');
    } else {
      data.id = nextId++;
      data.created = Date.now();
      state.push(data);
      toast('已创建任务');
    }
    save(); render(); closeModal();
  }

  // ---- 事件绑定 ----
  document.getElementById('btn-add').addEventListener('click', function () { openModal(null); });
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  document.getElementById('btn-save').addEventListener('click', saveModal);
  modalBg.addEventListener('click', function (e) { if (e.target === modalBg) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      document.getElementById('search').focus();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && modalBg.classList.contains('open')) {
      e.preventDefault(); saveModal();
    }
  });

  document.getElementById('search').addEventListener('input', function (e) {
    searchQ = e.target.value.trim(); render();
  });
  document.getElementById('filter').addEventListener('change', function (e) {
    filterPriority = e.target.value; render();
  });
  document.getElementById('btn-reset').addEventListener('click', function () {
    if (!confirm('确定恢复示例数据吗？当前任务会丢失。')) return;
    state = seed.map(function (t) { return Object.assign({}, t); });
    nextId = state.reduce(function (m, t) { return Math.max(m, t.id); }, 0) + 1;
    save(); render(); toast('已重置为示例数据');
  });

  // 卡片点击（事件委托）
  document.getElementById('board').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var card = btn.closest('.card');
    if (!card) return;
    var id = parseInt(card.getAttribute('data-id'), 10);
    var task = state.find(function (t) { return t.id === id; });
    if (!task) return;
    var act = btn.getAttribute('data-act');
    if (act === 'del') {
      if (!confirm('删除「' + task.title + '」？')) return;
      state = state.filter(function (t) { return t.id !== id; });
      save(); render(); toast('已删除');
    } else if (act === 'edit') {
      openModal(task);
    } else if (act === 'to-doing') {
      task.status = 'doing'; save(); render(); toast('→ 进行中');
    } else if (act === 'to-done') {
      task.status = 'done'; save(); render(); toast('✓ 已完成');
    } else if (act === 'to-todo') {
      task.status = 'todo'; save(); render(); toast('→ 已退回待办');
    }
  });

  // ---- 拖拽 ----
  var dragId = null;
  document.getElementById('board').addEventListener('dragstart', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    dragId = parseInt(card.getAttribute('data-id'), 10);
    card.classList.add('dragging');
    try { e.dataTransfer.setData('text/plain', String(dragId)); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* 老浏览器 */ }
  });
  document.getElementById('board').addEventListener('dragend', function (e) {
    var card = e.target.closest('.card');
    if (card) card.classList.remove('dragging');
    dragId = null;
    document.querySelectorAll('.col').forEach(function (c) { c.classList.remove('drop-active'); });
  });
  document.querySelectorAll('.col').forEach(function (col) {
    col.addEventListener('dragover', function (e) { e.preventDefault(); col.classList.add('drop-active'); });
    col.addEventListener('dragleave', function () { col.classList.remove('drop-active'); });
    col.addEventListener('drop', function (e) {
      e.preventDefault();
      col.classList.remove('drop-active');
      var id = dragId;
      if (id == null) {
        var raw = e.dataTransfer.getData('text/plain');
        id = parseInt(raw, 10);
      }
      if (!id || isNaN(id)) return;
      var st = col.getAttribute('data-status');
      var task = state.find(function (t) { return t.id === id; });
      if (!task || task.status === st) return;
      task.status = st;
      save(); render();
      toast('移动到「' + STATUS_LABEL[st] + '」');
    });
  });

  // 初始渲染
  render();
})();
</script>
</body>
</html>
