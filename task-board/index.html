<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务看板 · 前端 + 后端 API</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
    --danger: #ef4444; --ok: #22c55e; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 16px;
  }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 14px; min-width: 140px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[aria-invalid="true"] { border-color: var(--danger); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 9px 16px; font-size: 14px; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .error { color: var(--danger); font-size: 13px; margin-top: 6px; min-height: 16px; }
  .banner {
    padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px;
    border: 1px solid;
  }
  .banner.error { background: #2d1b1b; border-color: var(--danger); color: #fca5a5; }
  .banner.info { background: #1b2436; border-color: var(--accent); color: #93c5fd; }
  .hidden { display: none !important; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty {
    text-align: center; padding: 32px 16px; color: var(--muted); font-size: 14px;
  }
  .project-list { list-style: none; padding: 0; margin: 0; }
  .project-list li {
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }
  .project-list li:hover, .project-list li.active { border-color: var(--accent); background: #17233a; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .col {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
  }
  .col h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .task {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; margin-bottom: 8px; font-size: 14px;
  }
  .task .title { font-weight: 500; margin-bottom: 6px; }
  .task .actions { display: flex; gap: 6px; margin-top: 8px; }
  .task .actions button { font-size: 12px; padding: 4px 8px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 99px;
    background: #334155; color: var(--muted);
  }
  .badge.todo { background: #3b3b52; color: #a5b4fc; }
  .badge.in_progress { background: #3b3020; color: #fcd34d; }
  .badge.done { background: #1e3a2a; color: #86efac; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); border: 0;
  }
  @media (max-width: 600px) {
    .form-row { flex-direction: column; align-items: stretch; }
    input, select, button { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>📋 任务看板</h1>
  <button id="btn-logout" class="secondary hidden">退出登录</button>
</header>

<main>
  <!-- 登录视图 -->
  <section id="view-login" class="card" aria-labelledby="login-title">
    <h2 id="login-title" style="margin-top:0">登录</h2>
    <div id="login-banner" class="banner error hidden" role="alert"></div>
    <form id="form-login" novalidate>
      <div class="form-row">
        <div>
          <label for="login-user">用户名</label>
          <input id="login-user" name="username" autocomplete="username" required
                 aria-describedby="login-user-err" placeholder="demo">
          <div id="login-user-err" class="error" aria-live="polite"></div>
        </div>
        <div>
          <label for="login-pass">密码</label>
          <input id="login-pass" name="password" type="password" autocomplete="current-password"
                 required minlength="4" aria-describedby="login-pass-err" placeholder="demo1234">
          <div id="login-pass-err" class="error" aria-live="polite"></div>
        </div>
        <button type="submit" id="btn-login">登录</button>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:0">
        演示账号：<code>demo / demo1234</code>（或注册后使用）
      </p>
    </form>
    <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:14px">
      <h3 style="margin-top:0;font-size:15px">注册新账号</h3>
      <form id="form-register" class="form-row" novalidate>
        <div>
          <label for="reg-user">用户名</label>
          <input id="reg-user" required minlength="3" aria-describedby="reg-user-err">
          <div id="reg-user-err" class="error" aria-live="polite"></div>
        </div>
        <div>
          <label for="reg-pass">密码</label>
          <input id="reg-pass" type="password" required minlength="6" aria-describedby="reg-pass-err">
          <div id="reg-pass-err" class="error" aria-live="polite"></div>
        </div>
        <button type="submit" class="secondary" id="btn-register">注册</button>
      </form>
      <div id="register-banner" class="banner info hidden" role="alert"></div>
    </div>
  </section>

  <!-- 主视图 -->
  <section id="view-app" class="hidden">
    <div id="app-banner" class="banner error hidden" role="alert"></div>

    <div class="card">
      <div id="projects-loading" class="empty" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>加载项目中…
      </div>
      <div id="projects-error" class="banner error hidden" role="alert">
        项目加载失败。
        <button class="secondary" id="btn-reload-projects" style="margin-left:8px">重试</button>
      </div>
      <div id="projects-empty" class="empty hidden">
        <p>还没有任何项目，先创建一个吧 👇</p>
      </div>
      <div id="projects-content" class="hidden">
        <form id="form-project" class="form-row" style="margin-bottom:14px">
          <div style="flex:1;min-width:200px">
            <label for="proj-name">新建项目名称</label>
            <input id="proj-name" required minlength="2" maxlength="60"
                   aria-describedby="proj-name-err" placeholder="例如：官网改版">
            <div id="proj-name-err" class="error" aria-live="polite"></div>
          </div>
          <button type="submit" id="btn-create-project">创建项目</button>
        </form>
        <ul id="project-list" class="project-list" aria-label="项目列表"></ul>
      </div>
    </div>

    <div class="card" id="board-card" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 id="board-title" style="margin:0;font-size:17px">任务看板</h2>
        <div id="board-loading" hidden aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>加载任务…
        </div>
      </div>
      <div id="tasks-error" class="banner error hidden" role="alert">
        任务加载失败。
        <button class="secondary" id="btn-reload-tasks" style="margin-left:8px">重试</button>
      </div>
      <form id="form-task" class="form-row" style="margin-bottom:16px">
        <div style="flex:2;min-width:200px">
          <label for="task-title">新任务标题</label>
          <input id="task-title" required minlength="2" maxlength="120"
                 aria-describedby="task-title-err" placeholder="例如：写首页 Hero 区块">
          <div id="task-title-err" class="error" aria-live="polite"></div>
        </div>
        <div>
          <label for="task-status">初始状态</label>
          <select id="task-status">
            <option value="todo">待办</option>
            <option value="in_progress">进行中</option>
            <option value="done">已完成</option>
          </select>
        </div>
        <button type="submit" id="btn-create-task">添加任务</button>
      </form>
      <div id="tasks-empty" class="empty hidden">该项目还没有任务，添加一个吧。</div>
      <div id="board" class="board" role="list" aria-label="任务看板"></div>
    </div>
  </section>
</main>

<script>
(() => {
  // ====== 后端 API 配置 ======
  // 通过 ?api=<base> 覆盖，默认指向同源 /api
  const API = new URLSearchParams(location.search).get('api') || '/api';

  const $ = (id) => document.getElementById(id);
  const state = { token: null, projects: [], currentProject: null, tasks: [] };

  // ---------- 通用 fetch 封装：带 loading / 错误 ----------
  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    let res;
    try {
      res = await fetch(API + path, { ...opts, headers });
    } catch (e) {
      throw new Error('网络错误：无法连接服务器（' + e.message + '）');
    }
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      const msg = data.error || data.message || ('请求失败（HTTP ' + res.status + '）');
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return data;
  }

  // ---------- 表单校验 ----------
  function setFieldError(input, errId, msg) {
    input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    $(errId).textContent = msg || '';
  }
  function validateField(input, errId) {
    let msg = '';
    const v = input.value.trim();
    if (input.required && !v) msg = '此项必填';
    else if (input.minLength > 0 && v.length < input.minLength)
      msg = `至少 ${input.minLength} 个字符`;
    setFieldError(input, errId, msg);
    return !msg;
  }
  function bindValidation(input, errId) {
    input.addEventListener('blur', () => validateField(input, errId));
    input.addEventListener('input', () => {
      if (input.getAttribute('aria-invalid') === 'true') validateField(input, errId);
    });
  }
  bindValidation($('login-user'), 'login-user-err');
  bindValidation($('login-pass'), 'login-pass-err');
  bindValidation($('reg-user'), 'reg-user-err');
  bindValidation($('reg-pass'), 'reg-pass-err');
  bindValidation($('proj-name'), 'proj-name-err');
  bindValidation($('task-title'), 'task-title-err');

  function showBanner(id, msg) {
    const el = $(id);
    if (!msg) { el.classList.add('hidden'); el.textContent = ''; return; }
    el.textContent = msg; el.classList.remove('hidden');
  }
  function setBusy(btn, busy, loadingText) {
    if (busy) { btn.dataset.text = btn.textContent; btn.disabled = true;
      btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>' + (loadingText || '处理中…'); }
    else { btn.disabled = false; btn.textContent = btn.dataset.text || btn.textContent; }
  }

  // ---------- 登录 ----------
  $('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    showBanner('login-banner', '');
    const okU = validateField($('login-user'), 'login-user-err');
    const okP = validateField($('login-pass'), 'login-pass-err');
    if (!okU || !okP) return;
    const btn = $('btn-login');
    setBusy(btn, true, '登录中…');
    try {
      const data = await api('/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          username: $('login-user').value.trim(),
          password: $('login-pass').value,
        }),
      });
      state.token = data.token || data.access_token;
      localStorage.setItem('token', state.token);
      await enterApp();
    } catch (err) {
      showBanner('login-banner', '登录失败：' + err.message);
    } finally {
      setBusy(btn, false);
    }
  });

  // ---------- 注册 ----------
  $('form-register').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('btn-register');
    setBusy(btn, true, '注册中…');
    try {
      const okU = validateField($('reg-user'), 'reg-user-err');
      const okP = validateField($('reg-pass'), 'reg-pass-err');
      if (!okU || !okP) return;
      const data = await api('/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          username: $('reg-user').value.trim(),
          password: $('reg-pass').value,
        }),
      });
      state.token = data.token || data.access_token;
      localStorage.setItem('token', state.token);
      showBanner('register-banner', '注册成功，正在进入…');
      $('register-banner').classList.remove('error'); $('register-banner').classList.add('info');
      await enterApp();
    } catch (err) {
      showBanner('register-banner', '注册失败：' + err.message);
      $('register-banner').classList.add('error'); $('register-banner').classList.remove('info');
    } finally {
      setBusy(btn, false);
    }
  });

  // ---------- 登出 ----------
  $('btn-logout').addEventListener('click', () => {
    state.token = null;
    localStorage.removeItem('token');
    $('view-app').classList.add('hidden');
    $('view-login').classList.remove('hidden');
    $('btn-logout').classList.add('hidden');
    showBanner('login-banner', '');
  });

  // ---------- 进入主界面 ----------
  async function enterApp() {
    $('view-login').classList.add('hidden');
    $('view-app').classList.remove('hidden');
    $('btn-logout').classList.remove('hidden');
    await loadProjects();
  }

  // ---------- 项目列表 ----------
  async function loadProjects() {
    $('projects-loading').classList.remove('hidden');
    $('projects-error').classList.add('hidden');
    $('projects-empty').classList.add('hidden');
    $('projects-content').classList.add('hidden');
    try {
      const data = await api('/projects');
      state.projects = data.projects || data || [];
      $('projects-loading').classList.add('hidden');
      $('projects-content').classList.remove('hidden');
      if (!state.projects.length) $('projects-empty').classList.remove('hidden');
      renderProjects();
      if (state.projects.length && !state.currentProject) selectProject(state.projects[0]);
    } catch (err) {
      $('projects-loading').classList.add('hidden');
      if (err.status === 401) { doLogout('登录已过期，请重新登录'); return; }
      $('projects-error').classList.remove('hidden');
      $('projects-error').firstChild.textContent = '项目加载失败：' + err.message + ' ';
    }
  }
  function doLogout(msg) {
    state.token = null; localStorage.removeItem('token');
    $('view-app').classList.add('hidden');
    $('view-login').classList.remove('hidden');
    $('btn-logout').classList.add('hidden');
    showBanner('login-banner', msg);
  }
  $('btn-reload-projects').addEventListener('click', loadProjects);

  function renderProjects() {
    const ul = $('project-list');
    ul.innerHTML = '';
    state.projects.forEach(p => {
      const li = document.createElement('li');
      li.tabIndex = 0;
      li.setAttribute('role', 'button');
      if (state.currentProject && state.currentProject.id === p.id) li.classList.add('active');
      const name = document.createElement('strong');
      name.textContent = p.name;
      const meta = document.createElement('span');
      meta.className = 'badge';
      meta.textContent = p.task_count != null ? p.task_count + ' 任务' : '查看任务';
      li.append(name, meta);
      li.addEventListener('click', () => selectProject(p));
      li.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectProject(p); } });
      ul.appendChild(li);
    });
  }

  // ---------- 创建项目 ----------
  $('form-project').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!validateField($('proj-name'), 'proj-name-err')) return;
    const btn = $('btn-create-project');
    setBusy(btn, true, '创建中…');
    try {
      const data = await api('/projects', {
        method: 'POST',
        body: JSON.stringify({ name: $('proj-name').value.trim() }),
      });
      $('proj-name').value = '';
      setFieldError($('proj-name'), 'proj-name-err', '');
      await loadProjects();
      if (data.project || data.id) selectProject(data.project || data);
    } catch (err) {
      setFieldError($('proj-name'), 'proj-name-err', '创建失败：' + err.message);
    } finally {
      setBusy(btn, false);
    }
  });

  // ---------- 任务看板 ----------
  const STATUS = [
    { key: 'todo', label: '待办' },
    { key: 'in_progress', label: '进行中' },
    { key: 'done', label: '已完成' },
  ];

  async function selectProject(p) {
    state.currentProject = p;
    renderProjects();
    $('board-card').hidden = false;
    $('board-title').textContent = '任务看板 · ' + p.name;
    await loadTasks();
  }

  async function loadTasks() {
    $('board-loading').hidden = false;
    $('tasks-error').classList.add('hidden');
    try {
      const data = await api('/projects/' + state.currentProject.id + '/tasks');
      state.tasks = data.tasks || data || [];
      $('tasks-empty').classList.toggle('hidden', state.tasks.length > 0);
      renderBoard();
    } catch (err) {
      if (err.status === 401) { doLogout('登录已过期，请重新登录'); return; }
      $('tasks-error').classList.remove('hidden');
      $('tasks-error').firstChild.textContent = '任务加载失败：' + err.message + ' ';
    } finally {
      $('board-loading').hidden = true;
    }
  }
  $('btn-reload-tasks').addEventListener('click', loadTasks);

  function renderBoard() {
    const board = $('board');
    board.innerHTML = '';
    STATUS.forEach(s => {
      const col = document.createElement('div');
      col.className = 'col'; col.setAttribute('role', 'listitem');
      const h = document.createElement('h3');
      h.textContent = s.label + ' (' + state.tasks.filter(t => t.status === s.key).length + ')';
      col.appendChild(h);
      const items = state.tasks.filter(t => t.status === s.key);
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'empty'; empty.style.padding = '12px 4px';
        empty.textContent = '暂无任务';
        col.appendChild(empty);
      }
      items.forEach(t => col.appendChild(taskEl(t)));
      board.appendChild(col);
    });
  }

  function taskEl(t) {
    const el = document.createElement('div');
    el.className = 'task';
    const title = document.createElement('div');
    title.className = 'title'; title.textContent = t.title;
    const badge = document.createElement('span');
    badge.className = 'badge ' + t.status;
    badge.textContent = STATUS.find(s => s.key === t.status)?.label || t.status;
    const actions = document.createElement('div');
    actions.className = 'actions';
    STATUS.forEach(s => {
      if (s.key === t.status) return;
      const b = document.createElement('button');
      b.className = 'secondary'; b.textContent = '→ ' + s.label;
      b.setAttribute('aria-label', `将任务「${t.title}」改为${s.label}`);
      b.addEventListener('click', () => moveTask(t, s.key, b));
      actions.appendChild(b);
    });
    const del = document.createElement('button');
    del.className = 'secondary'; del.style.color = 'var(--danger)';
    del.textContent = '删除';
    del.setAttribute('aria-label', `删除任务「${t.title}」`);
    del.addEventListener('click', () => deleteTask(t, del));
    actions.appendChild(del);
    el.append(title, badge, actions);
    return el;
  }

  async function moveTask(t, status, btn) {
    btn.disabled = true;
    try {
      await api('/tasks/' + t.id, { method: 'PATCH', body: JSON.stringify({ status }) });
      await loadTasks();
    } catch (err) {
      showBanner('app-banner', '更新任务状态失败：' + err.message);
      btn.disabled = false;
    }
  }

  async function deleteTask(t, btn) {
    btn.disabled = true;
    try {
      await api('/tasks/' + t.id, { method: 'DELETE' });
      await loadTasks();
    } catch (err) {
      showBanner('app-banner', '删除任务失败：' + err.message);
      btn.disabled = false;
    }
  }

  $('form-task').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!state.currentProject) return;
    if (!validateField($('task-title'), 'task-title-err')) return;
    const btn = $('btn-create-task');
    setBusy(btn, true, '添加中…');
    try {
      await api('/projects/' + state.currentProject.id + '/tasks', {
        method: 'POST',
        body: JSON.stringify({
          title: $('task-title').value.trim(),
          status: $('task-status').value,
        }),
      });
      $('task-title').value = '';
      setFieldError($('task-title'), 'task-title-err', '');
      await loadTasks();
    } catch (err) {
      setFieldError($('task-title'), 'task-title-err', '创建失败：' + err.message);
    } finally {
      setBusy(btn, false);
    }
  });

  // ---------- 启动：有 token 就直接进 ----------
  (async () => {
    const saved = localStorage.getItem('token');
    if (saved) {
      state.token = saved;
      $('view-login').classList.add('hidden');
      $('view-app').classList.remove('hidden');
      $('btn-logout').classList.remove('hidden');
      await loadProjects();
    }
  })();
})();
</script>
</body>
</html>
