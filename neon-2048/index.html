<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · 霓虹方块</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #141e30, #243b55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Courier New", monospace; color: #dfe9ff; gap: 14px; padding: 16px;
    user-select: none;
  }
  h1 { font-size: 30px; letter-spacing: 8px; text-shadow: 0 0 14px #6cf; }
  .top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .score-box {
    background: rgba(0,20,40,.6); border: 2px solid #4af; border-radius: 8px;
    padding: 6px 18px; text-align: center; min-width: 92px;
  }
  .score-box small { display: block; font-size: 11px; color: #8ab; letter-spacing: 2px; }
  .score-box b { font-size: 22px; color: #6cf; }
  .btn {
    background: #4af; color: #04121f; border: none; padding: 9px 20px;
    font-size: 15px; font-weight: bold; letter-spacing: 3px; border-radius: 6px;
    cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: #7df; }
  .board {
    position: relative;
    background: rgba(6,14,26,.85);
    border: 3px solid #4af; border-radius: 10px;
    box-shadow: 0 0 28px rgba(68,170,255,.4);
    padding: 10px;
    touch-action: none;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 90px);
    grid-template-rows: repeat(4, 90px);
    gap: 10px;
  }
  .cell { background: rgba(255,255,255,.05); border-radius: 8px; }
  #tiles { position: absolute; inset: 10px; pointer-events: none; }
  .tile {
    position: absolute; width: 90px; height: 90px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 34px;
    transition: left .12s ease, top .12s ease;
    box-shadow: 0 0 12px rgba(255,255,255,.15);
  }
  .tile.pop { animation: pop .16s ease; }
  .tile.merge { animation: mergeGlow .2s ease; }
  @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes mergeGlow { 0% { filter: brightness(1.8); } 100% { filter: brightness(1); } }
  .hint { color: #789; font-size: 13px; text-align: center; line-height: 1.7; }
  #banner {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(4,8,16,.85); border-radius: 8px; text-align: center;
  }
  #banner h2 { color: #6cf; font-size: 30px; letter-spacing: 4px; }
  #banner.win h2 { color: #ffd166; text-shadow: 0 0 16px #ffd166; }
  #banner p { color: #aab; font-size: 14px; line-height: 1.8; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="top">
  <div class="score-box"><small>得分</small><b id="score">0</b></div>
  <div class="score-box"><small>最高</small><b id="best">0</b></div>
  <button class="btn" id="restart">新游戏</button>
</div>
<div class="board" id="board">
  <div class="grid" id="grid"></div>
  <div id="tiles"></div>
  <div id="banner">
    <h2 id="bTitle">游戏结束</h2>
    <p id="bText"></p>
    <button class="btn" id="bBtn">再来一局</button>
  </div>
</div>
<div class="hint">方向键 / WASD / 滑动 移动方块<br>相同数字合并，目标拼出 <b style="color:#ffd166">2048</b></div>

<script>
const SIZE = 4;
const gridEl = document.getElementById('grid');
const tilesEl = document.getElementById('tiles');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const banner = document.getElementById('banner');
const bTitle = document.getElementById('bTitle');
const bText = document.getElementById('bText');
const bBtn = document.getElementById('bBtn');

const COLORS = {
  2:    ['#1e3a5f', '#9fd8ff'],
  4:    ['#1e5f5f', '#a9fff0'],
  8:    ['#5f4a1e', '#ffe6a1'],
  16:   ['#5f351e', '#ffcf9f'],
  32:   ['#5f1e2e', '#ffb3c1'],
  64:   ['#5f1e4a', '#ffb3e6'],
  128:  ['#3d1e5f', '#e0b3ff'],
  256:  ['#1e5f35', '#b3ffd1'],
  512:  ['#5f561e', '#fff3a1'],
  1024: ['#5f2a1e', '#ffbc9f'],
  2048: ['#5f4f1e', '#ffe58a'],
  4096: ['#2a1e5f', '#c9b3ff'],
  8192: ['#1e2a5f', '#a1c4ff'],
};
function colors(v) {
  if (COLORS[v]) return COLORS[v];
  return ['#4a1e5f', '#ffb3ff'];
}

let board, score, best = 0, over = false, won = false, moving = false;

// 初始化格子背景
for (let i = 0; i < SIZE * SIZE; i++) {
  const d = document.createElement('div');
  d.className = 'cell';
  gridEl.appendChild(d);
}

function emptyCells() {
  const res = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (board[r][c] === 0) res.push({r, c});
  return res;
}

function addRandom() {
  const empty = emptyCells();
  if (!empty.length) return;
  const {r, c} = empty[(Math.random() * empty.length) | 0];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
  renderTile(r, c, board[r][c], true);
}

function pos(r, c) {
  return { left: c * 100, top: r * 100 }; // 90 + 10 gap
}

function renderTile(r, c, v, pop) {
  const t = document.createElement('div');
  t.className = 'tile' + (pop ? ' pop' : '');
  t.dataset.id = `${r}-${c}-${Date.now()}-${Math.random()}`;
  applyStyle(t, v);
  const p = pos(r, c);
  t.style.left = p.left + 'px';
  t.style.top = p.top + 'px';
  tilesEl.appendChild(t);
  return t;
}

function applyStyle(t, v) {
  const [bg, fg] = colors(v);
  t.style.background = bg;
  t.style.color = fg;
  t.textContent = v;
  t.style.fontSize = v >= 1024 ? '24px' : v >= 128 ? '28px' : '34px';
  t.style.textShadow = `0 0 8px ${fg}`;
}

// 全量重绘（简单可靠）
function redraw() {
  tilesEl.innerHTML = '';
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (board[r][c]) renderTile(r, c, board[r][c], false);
}

function move(dir) {
  if (over || moving) return false;
  // dir: 0=up 1=right 2=down 3=left
  const before = JSON.stringify(board);
  let gained = 0;
  const mergedIdx = new Set();

  function traverse(cb) {
    for (let i = 0; i < SIZE; i++)
      for (let j = 0; j < SIZE; j++) {
        let r, c;
        if (dir === 0) { r = i; c = j; }
        else if (dir === 1) { r = i; c = SIZE - 1 - j; }
        else if (dir === 2) { r = SIZE - 1 - i; c = j; }
        else { r = i; c = SIZE - 1 - j; /* left: iterate rows, cols l->r */ }
        if (dir === 3) { r = i; c = j; }
        cb(r, c);
      }
  }

  traverse((r, c) => {
    if (board[r][c] === 0) return;
    let nr = r, nc = c;
    const dr = [-1, 0, 1, 0][dir], dc = [0, 1, 0, -1][dir];
    let pr = r, pc = c;
    while (true) {
      const tr = nr + dr, tc = nc + dc;
      if (tr < 0 || tc < 0 || tr >= SIZE || tc >= SIZE) break;
      if (board[tr][tc] === 0) { nr = tr; nc = tc; continue; }
      if (board[tr][tc] === board[r][c] && !mergedIdx.has(tr + ',' + tc)) {
        nr = tr; nc = tc;
        break;
      }
      break;
    }
    if (nr === r && nc === c) return;
    const val = board[r][c];
    const target = board[nr][nc];
    board[r][c] = 0;
    if (target === val) {
      board[nr][nc] = val * 2;
      gained += val * 2;
      mergedIdx.add(nr + ',' + nc);
      if (val * 2 === 2048) won = true;
    } else {
      board[nr][nc] = val;
    }
  });

  if (JSON.stringify(board) === before) return false;
  score += gained;
  best = Math.max(best, score);
  localStorage.setItem('neon2048_best', best);
  updateHud();
  moving = true;
  redraw();
  // 合并闪光标记
  mergedIdx.forEach(k => {
    const [r, c] = k.split(',').map(Number);
    const el = findTile(r, c);
    if (el) { el.classList.add('merge'); setTimeout(() => el.classList.remove('merge'), 220); }
  });
  setTimeout(() => {
    moving = false;
    addRandom();
    if (isOver()) endGame(false);
    else if (won) { endGame(true); won = false; }
  }, 130);
  return true;
}

function findTile(r, c) {
  // redraw 后按位置匹配
  const p = pos(r, c);
  return [...tilesEl.children].find(t =>
    Math.abs(parseFloat(t.style.left) - p.left) < 1 &&
    Math.abs(parseFloat(t.style.top) - p.top) < 1);
}

function isOver() {
  if (emptyCells().length) return false;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      const v = board[r][c];
      if (r + 1 < SIZE && board[r+1][c] === v) return false;
      if (c + 1 < SIZE && board[r][c+1] === v) return false;
    }
  return true;
}

function updateHud() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
}

function endGame(win) {
  over = true;
  banner.style.display = 'flex';
  banner.className = win ? 'win' : '';
  bTitle.textContent = win ? '🎉 拼出 2048！' : '游戏结束';
  bText.innerHTML = `得分 <b style="color:#6cf">${score}</b> · 最高 <b style="color:#6cf">${best}</b><br>` +
    (win ? '你可以继续挑战更大数字' : '再试一次吧');
  bBtn.textContent = win ? '继续玩' : '再来一局';
}

function newGame() {
  board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  score = 0; over = false; won = false; moving = false;
  banner.style.display = 'none';
  tilesEl.innerHTML = '';
  addRandom();
  addRandom();
  updateHud();
}

document.getElementById('restart').addEventListener('click', newGame);
bBtn.addEventListener('click', () => {
  if (won || banner.classList.contains('win')) { banner.style.display = 'none'; over = false; if (isOver()) endGame(false); }
  else newGame();
});

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = { arrowup:0, w:0, arrowright:1, d:1, arrowdown:2, s:2, arrowleft:3, a:3 };
  if (k in map) { e.preventDefault(); move(map[k]); }
});

// 触屏滑动
let sx = 0, sy = 0, touching = false;
const boardEl = document.getElementById('board');
boardEl.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; touching = true;
}, {passive:true});
boardEl.addEventListener('touchend', e => {
  if (!touching) return;
  touching = false;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) + Math.abs(dy) < 30) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 3);
  else move(dy > 0 ? 2 : 0);
}, {passive:true});

best = parseInt(localStorage.getItem('neon2048_best') || '0', 10);
newGame();
</script>
</body>
</html>
